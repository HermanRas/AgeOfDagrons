# Generic stone rubble for the long wall segment's destroyed state. Also
# stands in for the gate's rubble -- wall_gate.xml declares no distinct
# SpawnEntityOnDeath, deferring to the defensive-wall base it shares with
# wall_long (see wall_gate.toml).
id      = "vis.rubble_wall_long"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_wall_long.xml"

[render]
# inspect: 38.270 x 11 x 5.393 raw units -- the longest of the three, still
# lower than the destruct_stone_3x3/destruct_hele_cc calibration pair.
canvas = [608, 288]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.5
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
