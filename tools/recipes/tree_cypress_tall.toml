# Giant Mediterranean cypress from 0 A.D. -- a fourth tree species
# (ASSET_MISSING.md 2.3 "Tree species variants"). Single <variant>, fully
# deterministic -- no isobake changes needed.
id      = "vis.tree_cypress_tall"
adapter = "zeroad"

[source]
actor = "flora/trees/mediterranean_cypress_tall.xml"
# `isobake inspect` measures this actor at 2.158 x 2.109 x 16.002 m raw --
# narrower and a bit shorter than cypress_test.xml, so it reads as a distinct
# size class of the same species rather than a duplicate.

[render]
canvas = [320, 320]
supersample = 2
directions = 5
frame_origin_at = 0.08
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/flora/trees/mediterranean_cypress_tall.xml"
