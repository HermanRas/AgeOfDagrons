# Field -- ONE OF FOUR RANDOM FIELD VARIANTS. NOT an age skin, despite the id.
#
# Owner, 2026-09-01: "fields dont age, random selected at placement time, working
# as intended." A field attaches to the mill and the game picks one of four at
# PLACEMENT time. game/data/visuals.json maps vis.field_1..4 onto field_age2,
# field_age3, field_age4 and farm. The `_ageN` ids are historical -- they came
# from the 2026-08-15 age pass below -- and are NOT worth renaming, because the
# game reads them by name.
#
# LOAD-BEARING AND ONE LINE FROM BEING DESTROYED: age2, age3 and age4 all name
# the SAME actor (plot_field_temp.xml) and differ ONLY because isobake seeds the
# variant RNG from the RECIPE ID (zeroad.py _import_actor), so each rolls its own
# crop. That accident IS the variety the game is using. Adding `variant_seed` to
# these three -- the fix that was right for player colour, AGENT_ASSET.md 4 --
# would collapse all three into one field. Do not. (farm.toml is a genuinely
# different actor, the Mediterranean one, so it varies on purpose.)
#
# Generated 2026-08-15 with the rest of the age-2 building pass, when fields were
# still expected to age. Buildings carry the age; units do not.
#
# Actor resolved through its entity template, never guessed from a filename:
#   simulation/templates/structures/gaul/field.xml -> <VisualActor><Actor>
#
# The TEMPERATE field, not the Mediterranean one age 1 uses -- 0 A.D. keys fields to biome rather than to civ, and both gaul and germ resolve here.
#
# Render settings inherited from `farm.toml`. Canvas by interpolation:
# a same-role building at the same footprint frames within the same box, and the
# clip-check reports a canvas that is too small rather than cropping silently --
# so read the first bake's report rather than trusting this.
id      = "vis.field_age2"
adapter = "zeroad"

[source]
actor = "structures/plot_field_temp.xml"

[render]
canvas = [768, 768]
supersample = 4
directions = 1
frame_origin_at = 0.5
ground_clip = true
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/plot_field_temp.xml"
