# Generic stone rubble for the wall tower's destroyed state -- much smaller
# than the other rubble mounds. See rubble_3x3.toml for why these are keyed
# by size.
id      = "vis.rubble_wall_tower"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_wall_tower.xml"

[render]
# inspect: 15 x 15 x 3.872 m -- smaller and lower than the
# destruct_stone_3x3/destruct_hele_cc calibration pair, scaled down
# accordingly.
canvas = [288, 240]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.5
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/destruct_stone_wall_tower.xml"
