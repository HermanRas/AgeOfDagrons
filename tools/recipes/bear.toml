# Bear -- `res.bear`, gaia food 300 (PLAN.md 9.2). NEW 2026-08-15: like the
# cattle, this was in the roster from the start and never had a recipe, so the
# entity had no art at all.
#
# Resolved through its template, which also settles which of the three bears:
#
#   simulation/templates/gaia/fauna_bear_brown.xml
#     -> <VisualActor><Actor>fauna/bear_brown.xml</Actor>
#
# 0 A.D. ships black, brown and polar bears; the roster's `gaia/fauna_bear` is
# not itself a template name, and `fauna_bear_brown` is the temperate-biome one
# that matches the rest of our wildlife (deer, boar, wolf, sheep).
id      = "vis.bear"
adapter = "zeroad"

[source]
actor = "fauna/bear_brown.xml"
# Its clips come from shared variant files (`quadraped/base_bear.xml` and
# `base_bear_death.xml`) rather than being declared inline -- the same shape as
# the cattle, and the path isobake has always resolved.

[render]
# Unmeasured. The deer/sheep/wolf trio all sit comfortably in 128x128 at roughly
# 2 m tall; a brown bear is the largest predator in the set and reads bulkier
# than tall, so this starts one step up and slightly wide. Read the clip report
# on the first bake rather than trusting the interpolation.
canvas = [160, 144]
supersample = 4
# 5 stored, mirrored to 8 -- consistent with every other gaia animal. A bear
# carries nothing on one side, so mirroring is safe.
directions = 5
frame_origin_at = 0.15
engine = "eevee"
samples = 24

# STATIC, consistent with the rest of the wildlife, and now by choice rather
# than by blocker -- PLAN.md 13.2 item 8's quadruped animation-transfer bug is
# fixed. Animating it is A.4a work and needs a per-clip measured
# `location_scale`; see sheep.toml for the procedure.

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/fauna/bear_brown.xml"
