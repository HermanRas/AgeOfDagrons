# Building site for a 6x6-tile footprint -- the barracks' foundation.
# See foundation_8x8.toml for why these are keyed by footprint size.
id      = "vis.foundation_6x6"
adapter = "zeroad"

[source]
actor = "structures/fndn_6x6.xml"
# simulation/templates/structures/athen/barracks.xml declares this as its
# FoundationActor.

[render]
# inspect: 26 x 26 x 4.624 m, same low build-site height as fndn_4x4/fndn_8x8.
# Canvas interpolated from those two calibrated bakes (18m->320x192,
# 34m->576x352): ~15 px/m width, ~8.6 px/m height off size_x.
canvas = [448, 288]
supersample = 4
directions = 1
frame_origin_at = 0.45
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/fndn_6x6.xml"
