# Wall segment, from 0 A.D.'s Athenian stone curtain wall (short piece).
#
# Not a fundamentally different problem from the single-sprite buildings --
# 0 A.D.'s own WallPiece component (simulation/components/WallPiece.js) places
# a fixed catalog of rigid straight segments end-to-end; there is no dynamic
# mesh tiling to reproduce. wall_short/medium/long are simply three more
# actors of this shape, and the corner piece reuses vis.tower's existing bake
# (wall_tower.xml, already baked) rather than needing its own -- 0 A.D. has no
# separate angled corner mesh, the square tower doubles as the corner by
# placement convention. See ASSET_MISSING.md.
id      = "vis.wall_short"
adapter = "zeroad"

[source]
actor = "structures/athenians/wall_short.xml"
# simulation/templates/structures/athen/wall_short.xml: Square 13x6 world
# units -> 6.5x3 m, on FoundationActor structures/fndn_3x3_wall.xml and
# SpawnEntityOnDeath rubble/rubble_stone_wall_short.

[render]
# inspect measures 12.417 x 5.610 x 23.080 raw units -> 6.21 x 2.81 x 11.54 m.
# Tall and narrow like the wall tower (tower.toml, canvas [256,448] for a
# similar height), not footprint-diamond-dominated like the low buildings, so
# frame_origin_at sits near the top of a generous canvas.
canvas = [288, 384]
supersample = 4
# 4 directions, not 1 (2026-08-15, project owner). A wall is not a building:
# buildings sit at one fixed orientation, walls RUN -- they enclose a base, so
# every piece has to be placeable along either diagonal and facing either way.
# One sprite cannot do that. 4 evenly-spaced yaws is the whole wall vocabulary.
#
# Costs 4x the frames but NOT a bigger canvas: in a 2:1 isometric projection the
# two diagonals project to mirror-image bounding boxes of identical size, so the
# canvas measured for the current orientation still holds at 90/180/270. Read
# the clip report on the first bake anyway rather than trusting that.
directions = 4
frame_origin_at = 0.15
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/athenians/wall_short.xml"
