# Wall segment, from 0 A.D.'s Athenian stone curtain wall (short piece).
#
# Not a fundamentally different problem from the single-sprite buildings --
# 0 A.D.'s own WallPiece component (simulation/components/WallPiece.js) places
# a fixed catalog of rigid straight segments end-to-end; there is no dynamic
# mesh tiling to reproduce. wall_short/medium/long are simply three more
# actors of this shape, and the corner piece reuses vis.tower's existing bake
# (wall_tower.xml, already baked) rather than needing its own -- 0 A.D. has no
# separate angled corner mesh, the square tower doubles as the corner by
# placement convention. See ASSET_MISSING.md.
id      = "vis.wall_short"
adapter = "zeroad"

[source]
actor = "structures/athenians/wall_short.xml"
# simulation/templates/structures/athen/wall_short.xml: Square 13x6 world
# units -> 6.5x3 m, on FoundationActor structures/fndn_3x3_wall.xml and
# SpawnEntityOnDeath rubble/rubble_stone_wall_short.

[render]
# inspect measures 12.417 x 5.610 x 23.080 raw units -> 6.21 x 2.81 x 11.54 m.
# Tall and narrow like the wall tower (tower.toml, canvas [256,448] for a
# similar height), not footprint-diamond-dominated like the low buildings, so
# frame_origin_at sits near the top of a generous canvas.
canvas = [288, 384]
supersample = 4
# 8 directions, not 1 (2026-08-15, project owner: "walls go around your base").
# A wall is not a building: buildings sit at one fixed orientation, walls RUN, so
# every piece must be placeable along either diagonal and facing either way.
#
# The owner asked for 4 and isobake rejects it -- "directions must be 1, 5 or 8".
# That is not an arbitrary limit. Directions are SCREEN compass points at 45
# degree steps (S SW W NW N NE E SE), so a bare count of 4 does not say WHICH
# four: starting at S gives S/W/N/E, starting at SE gives the diagonals. And the
# atlas contract promises every one of the 8 facings resolves to a stored frame
# plus a flip, which 4 stored frames cannot satisfy without a format change.
#
# 8 is the value that cannot be wrong. 5 (stored + mirrored to 8) would halve
# this and is probably valid -- a straight wall segment looks symmetric about the
# vertical screen axis -- but "probably symmetric" is the kind of guess that has
# already cost this project twice today, so it stays at 8 until someone looks at
# a turntable and says otherwise. Real 4-direction support is the proper fix and
# is an isobake + atlas-format change, not a recipe value.
directions = 8
frame_origin_at = 0.15
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
