# Stable, from 0 A.D.'s Hellenic stable (Athenians declare no footprint
# override, per simulation/templates/structures/athen/stable.xml).
id      = "vis.stable"
adapter = "zeroad"

[source]
actor = "structures/hellenes/stable.xml"

[render]
# inspect measures 18.274 raw units tall -> 9.14 m -- already 179px at
# height*cos(30)*ppm alone, which left only 176px of headroom at the original
# 320/0.45 and clipped a chimney finial off the top (caught by `isobake bake`'s
# too-small-canvas check, not by eye). Raised and re-centred.
canvas = [384, 384]
supersample = 4
directions = 1
frame_origin_at = 0.4
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/hellenes/stable.xml"
