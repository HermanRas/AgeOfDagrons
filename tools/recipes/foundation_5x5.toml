# Building site for a 5x5-tile footprint -- the blacksmith's foundation.
# See foundation_8x8.toml for why these are keyed by footprint size.
id      = "vis.foundation_5x5"
adapter = "zeroad"

[source]
actor = "structures/fndn_5x5.xml"
# simulation/templates/structures/hele/blacksmith.xml declares this as its
# FoundationActor.

[render]
# inspect: 22.658 x 22.359 x 4.624 m. Canvas interpolated from the
# fndn_4x4/fndn_8x8 calibration pair.
canvas = [416, 256]
supersample = 4
directions = 1
frame_origin_at = 0.45
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/fndn_5x5.xml"
