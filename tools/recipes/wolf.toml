# Wolf -- the roster's only hostile gaia entity (ASSET_MISSING.md 2.3), so it is
# the one animal that needs an ATTACK clip and not just idle/walk/die.
#
# Actor verified 2026-08-15: gaia/fauna_wolf.xml -> fauna/wolf.xml, already
# correct.
#
# ANIMATED 2026-08-27 (asset_request.md P1 / A.4a). It was static for a reason
# that had already been fixed: PLAN.md 13.2 item 8's quadruped
# animation-transfer bug, worked around here by attaching no clip at all so the
# bug could never trigger. Per-clip `location_scale` fixed the bug itself, and
# this recipe kept the workaround long after it stopped being needed.
#
# `location_scale` is NOT set on any clip below, and that is a measurement
# rather than an omission -- the wolf's clip .dae files import at the same
# scale as its mesh, so the default 1.0 is correct and the mesh does not tear.
# Do not copy deer_carcass.toml's 0.0319 here: that figure is specific to the
# deer's death clip and applying it would collapse the animation to nothing.
#
# wolf.xml declares the richest clip set of any animal in the roster: Idle
# (wolf_idle_01/02/03), Walk (wolf_walk), Run (wolf_run), attack_melee
# (wolf_attack_01/02), death (wolf_death_01/02). Our vocabulary (2.5) wants
# idle / walk / attack / die / decay, so every slot is covered with real source
# animation and nothing has to be substituted.
#
# To animate: each clip needs its OWN measured `location_scale` -- see
# sheep.toml and deer_carcass.toml for the procedure. The wolf actor measures
# 4.582 raw units tall (2.291 m), which is the numerator of the estimate.
id      = "vis.wolf"
adapter = "zeroad"

[source]
actor = "fauna/wolf.xml"

[render]
# `isobake inspect` measures 0.800 x 3.410 x 2.291 m raw -- close to deer.xml,
# slightly taller/leaner, so deer.toml's canvas is a safe start.
#
# 256, up from 128, when the clips landed 2026-08-27. A MOVING wolf does not fit
# a canvas calibrated on a standing one: at 128 the clip-check reported 67 of
# 240 frames touching the render edge, and it started with `idle` rather than
# the run or the lunge -- the rest pose was already close to the edge and any
# animation at all pushed it over. Expect the same on the other five species;
# read the batch summary rather than assuming their canvases still hold.
canvas = [256, 256]
supersample = 4
directions = 5
frame_origin_at = 0.15
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

# Clip names are case-sensitive and 0 A.D. is NOT consistent about them across
# fauna: the wolf declares `attack_melee` and `death` in lower case, the boar
# `attack_melee` but `Death`, the bear `Attack_Melee` and the zebu
# `Attack_melee`. Run `tools/check_clips.py` after editing any of these -- it
# resolves every name against the actor in about a second, and the alternative
# is a bake that fails ten minutes in.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
# The roster's only hostile gaia entity, so it is the one animal that needs an
# attack at all.
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose: without it, decay samples position 0.0, which
# is the death clip's FIRST frame -- the wolf still standing -- so the corpse
# stands up for a frame before falling over again.
start = 1.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/fauna/wolf.xml"
