# Generic stone rubble for a 5x5 building -- shared by barracks, archery
# range, stable and market's destroyed state. See rubble_3x3.toml for why
# these are keyed by size and shared.
id      = "vis.rubble_5x5"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_5x5.xml"

[render]
# inspect: 38 x 38 x 12.211 m. Canvas interpolated from the
# destruct_stone_3x3/destruct_hele_cc calibration pair (~13 px/m width,
# ~5.8 px/m height off size_x), with extra height margin for this mound's
# taller-than-baseline profile.
canvas = [608, 480]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.55
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/destruct_stone_5x5.xml"
