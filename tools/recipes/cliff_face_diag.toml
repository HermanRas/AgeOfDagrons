# Cliff edge, DIAGONAL -- one tile-diagonal of face, seen square on.
#
# The same piece as `cliff_face.toml` with two numbers changed: it spans a tile
# DIAGONAL (2.83 m) instead of a tile edge (2.0 m), and it stands on the tile's
# CORNER (1.414 m from centre) instead of its edge (1.0 m). Everything else --
# the flat drop-in model, the 75-degree batter, the art and its attribution --
# is cliff_face.toml's and is not repeated here.
#
# ------------------------------------------------------- WHY IT HAS TO EXIST
# Owner 2026-09-22, with a painted mock-up: an E-W cliff must read as a STRAIGHT
# FLAT WALL across the screen. It cannot be built from the axis pieces, and the
# reason is worth writing down because it looks like a corner bug and is not:
#
#   on an E-W run the high region is `gx + gy <= c`, and the tiles ON that
#   boundary touch only at their CORNERS. Every tile of sum c+1 is a NOTCH whose
#   -x and -y neighbours are both high. Two near faces hang from its two upper
#   edges and NEITHER covers the triangle above them, so the run comes out as
#   teeth with low ground showing between every pair.
#
# ⛔ SO IT IS NOT "THE OUTER CORNER, ONCE PER PLATEAU" -- it is once per tile,
# the whole length of the ridge. Probed the four 45-degree frames of
# `vis.cliff_face` as a cap first (they are the right ORIENTATION, and a corner
# is no more a tile edge than they are): they close the top of the wedge and
# leave the bottom open, because a 2.0 m quad turned 45 degrees projects to
# 46 px against a 64 px gap. The span is the fix, not the yaw.
#
# ✅ AND THE SPAN IS EXACTLY A TILE DIAGONAL. A quad through the notch tile's top
# vertex, perpendicular to it, 2.83 m wide, runs from the centre of one high tile
# to the centre of the next -- and consecutive notch tiles are 64 px apart on
# screen, so the pieces BUTT with no arithmetic. That is the same two-thirds
# relationship #122 measured for diagonal wall runs, arrived at from the other
# end.
#
# ⚠️ ONLY THE FOUR 45-DEGREE FRAMES OF THIS RECIPE ARE USABLE. `offset_m` puts
# the quad on a CORNER, which is right for stored 0/2/4/6 and wrong for the
# axis-aligned 1/3/5/7 -- the mirror image of cliff_face.toml, where the same
# four frames are the useless ones. One recipe cannot serve both, and which
# frame goes on which boundary is MEASURED by composing, never derived.
#
# This is also the first half of `diagonal-tiles` (#119).
id      = "vis.cliff_face_diag"
adapter = "composite"

[[source.parts]]
name    = "face"
adapter = "terrain"
texture = "Cliff_Gen/prepared/cliff_v2_s1.png"

# 2.828 m = sqrt(2) x 2.0, one diagonal tile step, 64 px across the screen.
size_metres    = [2.828, 5.30]
texture_metres = [16.0, 5.30]
pitch_deg      = 75.0
# -1.414 is the tile's half-DIAGONAL where cliff_face.toml's -1.0 is its
# half-EDGE. Local -y is the low side in both; the rotation is what differs.
offset_m       = [0.0, -1.414, -1.96]

[render]
canvas = [224, 288]
supersample = 4
directions = 8
frame_origin_at = 0.5
engine = "eevee"
samples = 32

[attribution]
# Not 0 A.D. art. See cliff_face.toml and board card #123.
source = "Age of Dragons -- AI-generated with Google Gemini (paid account)"
licence = "Project asset"
licence_url = "https://policies.google.com/terms"
author = "Herman Ras (project owner)"
author_url = "https://github.com/HermanRas/AgeOfDagrons"
actor = "assets/Cliff_Gen/sheet_cliff_faces_v2.jpg (strip 1)"
