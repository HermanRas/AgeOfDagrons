# Oak tree from 0 A.D. Static -- no armature, no animation -- so this proves the
# actor/mesh/texture/prop import path on its own, before animation is involved.
id      = "vis.tree"
adapter = "zeroad"

[source]
actor = "flora/trees/oak.xml"
# Scale defaults to metres_per_tile / 4, the 0 A.D. tile-to-tile ratio, which
# puts this oak at about 10 m. No override needed.

[render]
# A 10 m oak projects to 10 * cos(30) * 22.627 = 196 px tall, but the canopy's
# own width and the far-corner depth offset (same effect documented in
# castle.toml) push content past that on all of left/right/top at 224x224 --
# caught by isobake bake's canvas-edge check, not by eye. Widened with margin.
canvas = [320, 320]
supersample = 2
# Trees are roughly radially symmetric, but not exactly -- 5 stored directions
# give free variety without the render cost of 8.
directions = 5
frame_origin_at = 0.08
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/flora/trees/oak.xml"
