# Gold ore, LARGE size class -- 10000 (Age & Unit Planning.md §ORE).
# See gold_mine.toml for the set change and the ground-clip requirement.
#
#   simulation/templates/gaia/ore/aegean_anatolian_02.xml
#     -> <VisualActor><Actor>geology/metal_aegean_square.xml</Actor>
#
# "square" is the sculpt's name, not its silhouette -- it is a sprawling low
# pile, wider than the round one and shorter. Do not read the filename as a
# description; resolve and measure, same as everywhere else.
id      = "vis.gold_mine_large"
adapter = "zeroad"

[source]
actor = "geology/metal_aegean_square.xml"

[render]
# 21.465 x 13.005 x 7.182 m raw, 141 px tall -- the WIDEST of the three and the
# shortest, so 21.5 m (~486 px) sets the canvas on its own.
canvas = [576, 576]
supersample = 4
directions = 5
frame_origin_at = 0.45
ground_clip = true
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/geology/metal_aegean_square.xml"
