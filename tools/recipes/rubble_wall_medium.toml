# Generic stone rubble for the medium wall segment's destroyed state.
id      = "vis.rubble_wall_medium"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_wall_medium.xml"

[render]
# inspect: 26.318 x 9 x 5.151 raw units -- longer than rubble_wall_short but
# still lower than the destruct_stone_3x3/destruct_hele_cc calibration pair.
canvas = [448, 256]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.5
engine = "eevee"
samples = 32

