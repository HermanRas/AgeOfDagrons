# Gold ore, MEDIUM size class -- 5000 (Age & Unit Planning.md §ORE).
#
# RE-POINTED 2026-08-17 from `geology/metalmine_alpine.xml`, which was never on
# the roster. The alpine mine is the pale grey spire the game has shown since
# 0.4; the roster asks for the Aegean/Anatolian set, which is dark rock veined
# with visible gold and reads as *gold* at sprite size rather than as a rock.
# The project owner compared the two side by side and confirmed the swap.
#
#   simulation/templates/gaia/ore/aegean_anatolian_01.xml
#     -> <VisualActor><Actor>geology/metal_aegean_round.xml</Actor>
#
# THIS IS THE SET PLAN.md §13.2 item 7 WAS WAITING FOR. Those sculpts are
# authored half-sunk into terrain -- 0 A.D. hides the buried half behind terrain
# occlusion, which an orthographic bake cannot do -- so they were unusable until
# `render.ground_clip` existed. It does now, so `ground_clip = true` is not
# optional here: without it the sprite is mostly buried rock and its anchor
# lands mid-pile.
#
# Three size classes, three actors, three ids. `SimResourceNode.size_class` and
# `resources.json` have carried three amounts each all along while every size
# resolved to one sprite -- so a rich seam and a poor one were pixel-identical.
# See gold_mine_small.toml and gold_mine_large.toml for the other two.
id      = "vis.gold_mine"
adapter = "zeroad"

[source]
actor = "geology/metal_aegean_round.xml"

[render]
# `isobake inspect` measures 15.825 x 16.321 x 8.717 m raw, 171 px tall. Width
# is the constraint, not height: 16.3 m is ~369 px, and the raw height is
# roughly halved by the ground clip. Canvas is over-provisioned against that
# rather than fitted to it -- the packed page is trimmed to content either way,
# so a generous canvas costs render time and a mean one costs the bake.
canvas = [448, 448]
supersample = 4
directions = 5
frame_origin_at = 0.45
ground_clip = true
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/geology/metal_aegean_round.xml"
