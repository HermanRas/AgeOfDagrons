# Building site for the long wall segment, shared with the gate (0 A.D. pairs
# wall_gate with this same foundation).
id      = "vis.foundation_9x3_wall"
adapter = "zeroad"

[source]
actor = "structures/fndn_9x3_wall.xml"
# simulation/templates/structures/athen/wall_long.xml and wall_gate.xml both
# declare this as their FoundationActor.

[render]
# inspect: 38 x 14 x 4.624 raw units. Slightly larger size_x than fndn_8x8.xml
# (34 -> canvas [576,352]), extrapolated with the same per-unit slope used
# for foundation_6x6.toml/foundation_7x7.toml earlier this session.
canvas = [672, 416]
supersample = 4
# 8 directions, not 1 (2026-08-15, project owner: "walls go around your base").
# A wall is not a building: buildings sit at one fixed orientation, walls RUN, so
# every piece must be placeable along either diagonal and facing either way.
#
# The owner asked for 4 and isobake rejects it -- "directions must be 1, 5 or 8".
# That is not an arbitrary limit. Directions are SCREEN compass points at 45
# degree steps (S SW W NW N NE E SE), so a bare count of 4 does not say WHICH
# four: starting at S gives S/W/N/E, starting at SE gives the diagonals. And the
# atlas contract promises every one of the 8 facings resolves to a stored frame
# plus a flip, which 4 stored frames cannot satisfy without a format change.
#
# 8 is the value that cannot be wrong. 5 (stored + mirrored to 8) would halve
# this and is probably valid -- a straight wall segment looks symmetric about the
# vertical screen axis -- but "probably symmetric" is the kind of guess that has
# already cost this project twice today, so it stays at 8 until someone looks at
# a turntable and says otherwise. Real 4-direction support is the proper fix and
# is an isobake + atlas-format change, not a recipe value.
directions = 8
frame_origin_at = 0.45
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/fndn_9x3_wall.xml"
