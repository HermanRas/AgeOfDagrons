# Swordsman -- Gaulish infantry swordsman, Barracks from age 2 (PLAN.md 9.2).
# Britons ship only a `_c` tier, so Gauls it is; both are Celtic and units do not
# re-skin per age.
#
# Same mesh family as vis.spearman, which bakes clean, so this should not hit the
# bone-less `m_armor_tunic_short.dae` defect (spearman.toml's note). If it does,
# the `_b` variant is the substitute to try.
id      = "vis.swordsman"
adapter = "zeroad"

[source]
actor = "units/gauls/infantry_swordsman_a.xml"

[render]
canvas = [224, 224]
supersample = 2
# 8: sword and shield are one-sided, so mirroring would swap hands (PLAN.md 2.5).
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/units/gauls/infantry_swordsman_a.xml"
