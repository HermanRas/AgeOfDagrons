# Cavalry archer -- and it throws a javelin, because the Celts have no bows at
# all (PLAN.md 9.2.1 item 8). The `_e` elite tier of the Gaulish mounted
# javelinist, so it reads as a step above vis.scout_cavalry rather than as the
# same unit twice.
#
# See knight.toml for the composite-unit machinery this depends on.
id      = "vis.cavalry_archer"
adapter = "zeroad"

[source]
actor = "units/achaemenids/cavalry_archer_b_m.xml"

[render]
canvas = [384, 448]
supersample = 2
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_ranged"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "death"
frames = 2
fps = 1
loop = false

