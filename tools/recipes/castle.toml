# Castle, from 0 A.D.'s Athenian fortress.
id      = "vis.castle"
adapter = "zeroad"

[source]
actor = "structures/athenians/fortress.xml"

[render]
# inspect measures 24.393 raw units tall -> 12.2 m; footprint (Square 26x28
# world units -> 13x14 m, per simulation/templates/structures/athen/fortress.xml)
# makes this the largest square building baked so far after the wonder.
#
# 448x384 at frame_origin_at=0.4 clipped the corner tower's roof peak: the
# formula height*cos(30)*ppm ignores that the tallest point also sits toward
# the *far* corner, whose extra screen-projected depth (half_depth*sin(30)*ppm)
# stacks on top of the height term rather than being covered by it. Caught by
# `isobake bake`'s new too-small-canvas check, not by eye -- the trimmed
# turntable looked fine because trimming crops toward content and cannot show
# that the content already hit the render edge.
canvas = [448, 480]
supersample = 4
directions = 1
frame_origin_at = 0.32
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/athenians/fortress.xml"
