# Gate, from 0 A.D.'s Athenian wall gate. The actor (wall_gate_door.xml) is
# animated -- an armature with a `gateAction` clip driving closed/opening/
# open/closing -- but no recipe here assigns a clip, so it bakes at rest pose
# (closed), same treatment as vis.stable's static horse mesh: a skinned
# subject with no clip played is exactly as safe for isobake's ground_clip cut
# as any frozen mesh (isobake, fixed this session's stable bake). Open/closing
# states are a gameplay animation feature, not an art gap -- not attempted
# here.
id      = "vis.wall_gate"
adapter = "zeroad"

[source]
actor = "structures/athenians/wall_gate_door.xml"
# simulation/templates/structures/athen/wall_gate.xml: Footprint is a
# Right/Left/Door triple, not one rectangle, but the combined actor (door root
# + static wall_gate_struct.xml frame prop) still bakes as one sprite.
# FoundationActor is structures/fndn_9x3_wall.xml, shared with wall_long
# (already baked here); no distinct SpawnEntityOnDeath override, so it defers
# to the defensive-wall base -- treated as sharing vis.rubble_wall_long until
# a real difference is found.

[render]
# inspect measures 36.284 x 7.239 x 25.850 raw units -> 18.14 x 3.62 x 12.93 m
# -- slightly deeper and taller than a plain wall_long segment (the door frame
# and lintel extend past the wall's own thickness), so canvas is a step up
# from wall_long.toml's.
# First two attempts at [640,448] and [832,448] both clipped -- same overhang
# issue as wall_long.toml (see its comment); scaled proportionally from
# wall_medium.toml's working [900,700] data point instead of the footprint
# formula.
canvas = [1344, 832]
supersample = 4
# 8 directions, not 1 (2026-08-15, project owner: "walls go around your base").
# A wall is not a building: buildings sit at one fixed orientation, walls RUN, so
# every piece must be placeable along either diagonal and facing either way.
#
# The owner asked for 4 and isobake rejects it -- "directions must be 1, 5 or 8".
# That is not an arbitrary limit. Directions are SCREEN compass points at 45
# degree steps (S SW W NW N NE E SE), so a bare count of 4 does not say WHICH
# four: starting at S gives S/W/N/E, starting at SE gives the diagonals. And the
# atlas contract promises every one of the 8 facings resolves to a stored frame
# plus a flip, which 4 stored frames cannot satisfy without a format change.
#
# 8 is the value that cannot be wrong. 5 (stored + mirrored to 8) would halve
# this and is probably valid -- a straight wall segment looks symmetric about the
# vertical screen axis -- but "probably symmetric" is the kind of guess that has
# already cost this project twice today, so it stays at 8 until someone looks at
# a turntable and says otherwise. Real 4-direction support is the proper fix and
# is an isobake + atlas-format change, not a recipe value.
directions = 8
frame_origin_at = 0.15
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
