# Elite swordsman, Castle from age 4 (PLAN.md 9.2).
#
# Re-pointed 2026-08-15 to the owner's actual pick, `athen/champion_marine` --
# the Athenian Marine. It had been guessed as the Gaulish `_e` tier under the
# mistaken "units are Celtic in every age" reading (see knight.toml for how that
# error happened); units keep their hand-picked mixed-civ actors.
#
# `athen/champion_marine` is an entity TEMPLATE, not an actor -- 0 A.D. ships no
# champion_* actor files at all, which is why this was reported missing. The
# actor is inside it:
#
#   simulation/templates/units/athen/champion_marine.xml
#     -> <VisualActor><Actor>units/athenians/infantry_swordsman_c.xml</Actor>
#
# Note the tier is `_c` (citizen), not `_e`: 0 A.D. dresses its Athenian
# champion in the citizen-tier swordsman mesh and makes it a champion through
# stats alone. So this no longer reads as "the elite tier of the basic
# swordsman" -- vis.swordsman is `gauls/infantry_swordsman_a` and this is a
# visibly different soldier, which is arguably better for a Castle unit.
id      = "vis.elite_swordsman"
adapter = "zeroad"

[source]
actor = "units/athenians/infantry_swordsman_c.xml"

[render]
canvas = [224, 224]
supersample = 2
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/units/athenians/infantry_swordsman_c.xml"
