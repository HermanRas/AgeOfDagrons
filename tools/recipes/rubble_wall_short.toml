# Generic stone rubble for the short wall segment's destroyed state.
id      = "vis.rubble_wall_short"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_wall_short.xml"

[render]
# inspect: 15 x 7 x 4.142 raw units -- smaller footprint and notably lower
# height than the destruct_stone_3x3/destruct_hele_cc calibration pair, so
# scaled down from both axes.
canvas = [288, 224]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.5
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/destruct_stone_wall_short.xml"
