# Generic stone rubble for a small building -- the house's destroyed state.
#
# Keyed by size and shared, like the foundations: 0 A.D. names it 3x3 after the
# rubble mesh, not after the building, and its own house_big template points at
# it. Any later small structure reuses this id.
id      = "vis.rubble_3x3"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_3x3.xml"
# Reached from simulation/templates/template_structure_civic_house_big.xml:
# <SpawnEntityOnDeath>decay|rubble/rubble_stone_3x3</SpawnEntityOnDeath>.

[render]
# Measured off an unclipped probe: 304 x 195, only 72 px above the anchor but
# 123 below. Like the town centre's ruin this is mostly ground, and the mound
# also carries a buried skirt below z=0 (see house.toml) that terrain would
# normally hide.
canvas = [352, 256]
supersample = 4
directions = 1
frame_origin_at = 0.58
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/destruct_stone_3x3.xml"
