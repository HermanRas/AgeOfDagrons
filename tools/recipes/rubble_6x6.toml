# Generic stone rubble for a 6x6 building -- shared by the castle and the
# wonder's destroyed state (whether a wonder should have a rubble state at
# all is a game-design call, not an art one -- see ASSET_MISSING.md).
# See rubble_3x3.toml for why these are keyed by size and shared.
id      = "vis.rubble_6x6"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_6x6.xml"

[render]
# inspect: 44 x 44 x 12.934 m -- same footprint size as the destruct_hele_cc
# calibration point (44 m, canvas 640x384) but slightly taller, so height
# gets a small extra margin.
canvas = [640, 464]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.55
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/destruct_stone_6x6.xml"
