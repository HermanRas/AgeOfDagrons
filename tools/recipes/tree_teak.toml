# Teak -- 500 wood (Age & Unit Planning.md §ORE, wood section).
# See tree_elm.toml for the set and why these three were added.
#
#   simulation/templates/gaia/tree/teak.xml
#     -> <VisualActor><Actor>flora/trees/teak.xml</Actor>
id      = "vis.tree_teak"
adapter = "zeroad"

[source]
actor = "flora/trees/teak.xml"

[render]
# 25.656 x 25.115 x 33.731 m raw, 661 px tall -- the largest tree in the set.
canvas = [768, 768]
supersample = 2
directions = 5
frame_origin_at = 0.08
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/flora/trees/teak.xml"
