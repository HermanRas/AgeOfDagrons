# Lumber camp (ASSET_MISSING.md `vis.lumber_camp`), from 0 A.D.'s Hellenic
# storehouse -- their only generic resource-drop-off building; 0 A.D. does not
# distinguish a wood store from an ore store, so `vis.mining_camp` is the same
# actor. Flagged rather than silently duplicated: if lumber and mining camps
# need to read as different buildings, that is a source-picking decision for
# the project owner, not one to make unasked. See ASSET_MISSING.md.
id      = "vis.lumber_camp"
adapter = "zeroad"

[source]
actor = "structures/britons/storehouse.xml"

[render]
# inspect measures 16.280 raw units tall -> 8.14 m; footprint (Square 15x16
# world units -> 7.5x8 m, per simulation/templates/structures/athen/storehouse.xml).
# Raised from [320, 288] on 2026-08-14: this recipe was re-pointed from the
# hellenes storehouse to the BRITON one (age 1, PLAN.md 2.7) and the new mesh
# touches the frame edge -- the batch's canvas check caught it, "1 frame(s) touch
# the render edge and lost content".
canvas = [448, 384]
supersample = 4
directions = 1
frame_origin_at = 0.42
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/britons/storehouse.xml"
