# Mill (ASSET_MISSING.md `vis.mill`) -- the age-1 Briton rotary mill.
#
# Corrected 2026-08-15. This was on britons/farmstead, which was wrong: the
# project owner's pick is "Brit/Rotarymill" (Age & Unit Planning.md), and the
# rotary mill is NOT the farmstead. Only two actors in the whole checkout
# reference the rotary_mill props -- structures/britons/special.xml and
# structures/celts/special.xml -- so the Briton "special" building is the one
# carrying the mill, and britons/farmstead carries none of them.
#
# Worth knowing when reading the roster: "Brit/Rotarymill" names a BUILDING by
# what it visibly has on it, not by 0 A.D.'s filename for it.
id      = "vis.mill"
adapter = "zeroad"

[source]
actor = "structures/britons/special.xml"
# NO DONKEYS. Project owner's decision, 2026-08-15, after their attach points
# were measured and found to be unfixable from a recipe.
#
# The rotary mill harnesses two donkeys to its grinder, and 0 A.D. draws them
# right at the beam under the roof. Ours stood well outside the building. That
# is not the recipe and not the asset: the source rig
# (art/meshes/props/celt_rotary_mill_grinder.dae) places prop_donkey001/002 at
# y = -4 and +4, exactly symmetric, and the pinned Pyrogenesis importer builds
# those bones at y = -12.44 and +9.32 -- asymmetric and 2-3x too far. Both
# rotary mills share the rig and measure identically.
#
# No recipe value corrects that. `location_scale = 0` leaves the bones at rest,
# which is already too far out, and any larger value only pushes them further.
# The real fix is correcting prop-bone heads from the source .dae at import,
# which is an isobake feature nobody needs today.
#
# So the mill ships with its grindstone and no animals. It reads as a working
# mill -- the stone is the thing that says "mill" -- and an animal standing
# outside its own building reads as a bug. Restore by deleting this line and
# setting `drive_riders = false` (their own clips tear them apart: PLAN.md 13.2
# item 8, a donkey clip imports at ~31x its mesh scale).
#
# `Horse` is the donkey's ARMATURE, and it goes too -- leaving it behind would
# keep an empty rig in the scene for `_subject_armature` to consider.
drop_objects = ["donkey", "Horse"]

[anims.idle]
# THE DONKEY FIX, 2026-08-15. Everything below about "misplaced" props was
# wrong, and the real cause is embarrassingly plain: the mill was baked STATIC,
# so its grinder sat in REST POSE.
#
# In 0 A.D. the rotary mill's grinder plays a continuous `idle` clip, and that
# clip is what raises the grindstone upright, swings the beam and walks the
# donkeys around their circle. At rest the stone lies low, the beam is unswung
# and the donkeys stand wherever the rig was authored -- which is exactly the
# three complaints the project owner raised from the scenario-editor
# comparison: stone too small and low ("like it will go under the donkey"), the
# assembly off-centre from the doorway, and the donkey facing the wrong way for
# the direction of travel.
#
# `file` rather than `clip`: the clip belongs to the grinder PROP actor
# (props/structures/celts/rotary_mill_grinder.xml), not to the mill actor, so
# `_declared_animations` on structures/britons/special.xml finds nothing to look
# up by name. Naming the .dae directly is the supported way past that.
#
# Baking it as a one-frame "animation" keeps vis.mill a single-sprite building
# like every other structure -- this is a pose fix, not an animated building.
# Raise `frames` if the mill should visibly turn later; the sim has no concept
# of a working mill today.
file = "mechanical/celt_rotary_mill_grinder.dae"
frames = 1
fps = 1
loop = false
# ROTATION ONLY. The grinder clip carries the same clip-vs-mesh scale mismatch
# that PLAN.md 13.2 item 8 documents for quadrupeds -- the clip's rigged figure
# imports at a different scale than the actor's mesh, so its bone-LOCATION
# curves overshoot. Here that flings the two donkey attach bones far out from
# the pivot, and the donkeys ride them onto the roof and out past the wall.
#
# 0.0 rather than a measured ratio, deliberately. The rotation curves are the
# entire point of this clip -- they raise the grindstone and swing the beam --
# and the bones' REST positions are already the correct radius, which the
# earlier static bake showed. So there is nothing the location curves need to
# contribute, and zeroing them is exact rather than a value probed by eye.
location_scale = 0.0

[render]
# Re-measured 2026-08-15 on a 1024x768 probe with the decal fix in: the whole
# assembly occupies 248.5 x 148.5 in recipe space, spanning origin-relative
# x -134..+114 and y -92..+56. So [320, 256] at frame_origin_at 0.42 (160 each
# side, 107 above, 149 below) clears it with room to spare and is if anything
# generous below. Do NOT tighten it yet -- the grinder/donkey placement is still
# wrong (see the note below), and fixing it will move the bounds.
#
# THE DONKEY. The rotary mill's grinder prop carries two donkeys as nested props
# on its own armature (rotary_mill_grinder.xml -> prop_donkey001/002), and it
# attaches to the mill at attachpoint="root". Three findings, 2026-08-15:
#
#   1. It renders. One donkey and the grindstone are in frame at this canvas
#      now that ground decals are stripped -- the pre-decal-fix bake had them
#      missing, so this read as a framing problem when it was not one.
#   2. It rotates correctly. Probed at yaw 0 and yaw 180: the donkey moves with
#      the building, so `yaw_offset_deg` is applied to root-attached props and
#      is NOT the bug. Worth recording because it was the obvious suspect --
#      `isobake inspect` reports "Mill has no parent prop point named prop_root.
#      Root object name: Undefined", which looks like a smoking gun and is not.
#   3. It is in the WRONG PLACE, and its twin is missing. Checked against the
#      0 A.D. scenario editor: the donkeys should be harnessed to the grinder
#      beam UNDER the open bay of the roof, with the grindstone at the centre.
#      Ours stand outside the wall, unharnessed, and only one of the two appears.
#
# The lead is isobake's own warning on this bake: "every one of the 3 imported
# armatures is anchored to another object; falling back to the first". Three
# armatures = the grinder + one per donkey, and the fallback picks one, so the
# other donkey never gets driven. That is an isobake fix (multi-armature prop
# assemblies), not a recipe fix -- PLAN.md A.10.
canvas = [320, 256]
supersample = 4
directions = 1
frame_origin_at = 0.42
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
