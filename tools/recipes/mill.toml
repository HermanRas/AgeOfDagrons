# Mill (ASSET_MISSING.md `vis.mill`), from 0 A.D.'s Athenian farmstead -- the
# nearest match to a food-processing building in their roster; 0 A.D. has no
# separate "mill", the farmstead is where grain is turned into food.
id      = "vis.mill"
adapter = "zeroad"

[source]
actor = "structures/britons/farmstead.xml"

[render]
# inspect measures 12.654 raw units tall -> 6.33 m; footprint (Square 18x13
# world units -> 9x6.5 m, per simulation/templates/structures/athen/farmstead.xml)
# is the smallest in this batch, similar scale to the house.
canvas = [320, 256]
supersample = 4
directions = 1
frame_origin_at = 0.42
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/britons/farmstead.xml"
