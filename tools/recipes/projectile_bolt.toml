# Ballista bolt projectile, from 0 A.D.'s generic bolt prop --
# ASSET_MISSING.md 2.1. Static single-mesh prop, no armature.
id      = "vis.projectile_bolt"
adapter = "zeroad"

[source]
actor = "props/units/weapons/bolt.xml"

[render]
# `isobake inspect` measures 0.315 x 0.332 x 2.927 m raw.
canvas = [128, 128]
supersample = 4
directions = 5
frame_origin_at = 0.5
engine = "eevee"
samples = 24

