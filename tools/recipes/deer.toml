# Deer -- roams, and bolts when hit, so it earns a RUN as well as a walk.
# It is prey and never attacks, so no attack clip despite the actor having
# one.
#
# ANIMATED 2026-08-28 (asset_request.md P1 / A.4a).
#
# ---------------------------------------------------------------------------
# `location_scale` IS 0.0 ON EVERY CLIP, AND THAT IS THE FIX, NOT A DISABLING.
# Corrected 2026-08-28 after the owner reported "deer is messed up, so is dead
# deer" from play. Do not put a small non-zero number back here.
#
# THE CLIP'S BONE-LOCATION CURVES ARE MEANINGLESS ON THIS RIG AT ANY SCALE.
# What transfers between two skeletons that share bone NAMES is ROTATION; a
# pose-bone location is a local offset that only means the same thing on a rig
# with the same rest proportions. The deer's clips carry a 40-bone rig against
# the actor's 37 (`isobake inspect` says 36 shared, "transfers by bone name --
# no retarget needed", which is true of the rotations and false of the
# locations). So there is no correct multiplier: 0 is.
#
# HOW THE OLD NUMBER SURVIVED A FORTNIGHT. deer_carcass.toml records finding
# 0.0319 "by probing values from 0.022 to 0.045 and eyeballing the render".
# THE SEARCH RANGE NEVER CONTAINED THE ANSWER, so it returned the least-bad
# point in it and the residual was written off as "a skinning-weight seam".
# It also justified the figure by a size measurement taken at `directions = 1`
# -- and the defect is invisible from one direction, because a rigidly tilted
# animal only gives itself away by changing silhouette as it turns.
#
# THE MEASUREMENT THAT ACTUALLY SEPARATES GOOD FROM BAD is the spread of
# trimmed frame HEIGHT across the 8 screen directions of one clip. A standing
# quadruped barely changes height as it turns; every healthy species sits at
# x1.33-x1.48 (wolf x1.40, sheep x1.48, bear x1.33, cattle x1.44) and so does
# this deer's own REST pose at x1.45. The shipped 0.0319 gave x2.09 -- the
# animal reared up and pitched further with every direction index. 0.0254, the
# file's own inch-to-metre factor and the obvious "principled" candidate, gave
# x2.00 and is also wrong. 0.0 gives x1.50-x1.52 on idle, walk and death.
#
# THE ONE RESIDUAL, stated plainly because it will not fix itself: the ROOT
# bone's location is the one location curve that IS meaningful -- it carries
# the body's drop to the ground in `death` -- and zeroing every curve zeroes
# that too. The corpse therefore floats about 5 px (~0.22 m): its lowest pixel
# sits 4-8 px ABOVE the anchor where the wolf's sits 17-35 px below. Standing
# and walking are unaffected (+4 to +8, against the rest pose's +2 to +9).
#
# THE FLOAT IS THE ACCEPTED STATE. Owner's call, 2026-09-01: "not worth the
# pipeline change." Do not treat it as an open bug.
#
# AND THE FIX THIS COMMENT USED TO PROPOSE -- "teach isobake to exempt the root
# bone from location_scale" -- WAS MEASURED AND IT MAKES THE DEER WORSE: from
# floating +0.217 m to buried -1.145 m. The reason is structural, so do not try a
# variant of it. `location_scale` exists BECAUSE this clip is mis-scaled (its
# death .dae declares INCHES against a mesh in 0 A.D. units), so the root's Z
# curve carries the same error as every other curve; exempting it from the
# correction restores the error at full magnitude rather than restoring the drop.
# A factor of about 0.16 would make it land -- DO NOT FIT IT, that is the 0.0319
# mistake again, one data point on one clip.
#
# If it is ever reopened, the shape that works is `rest_on_ground` opt-in per
# anim: translate the posed body so its lowest vertex sits at z = 0. Unit
# independent, no fitted constant, right for a carcass and wrong for an animated
# `die` where the body should actually fall. AGENT_ASSET.md 4 has the measurement.
# ---------------------------------------------------------------------------
#
# CLIP SPELLING: the deer is entirely LOWER CASE -- `idle`, `walk`, `run`,
# `death`. Its capitalised `Idle` is a variant name, not an animation.
id      = "vis.deer"
adapter = "zeroad"

[source]
actor = "fauna/deer.xml"

[render]
# 256, up from 128. Calibrated on a STANDING animal, this canvas does not hold
# a moving one: the wolf clipped 67 of 240 frames at 128 and it started with
# `idle`, not the run. Matched to wolf.toml, which is proven at 240 frames.
# The 2026-08-28 probe renders this species 70 px wide, so there is room to
# spare -- but read the batch summary for CLIPPED rather than trusting that,
# because a 2-frame probe samples the ends of a clip and not its extremes.
canvas = [256, 256]
supersample = 4
directions = 5
frame_origin_at = 0.15
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. It STAYS ON after the 2026-08-27
# reflection fix -- index 0 is a fixed point of that sign flip, so removing
# it would put the animal back to showing its rump.
yaw_offset_deg = 180.0

[anims.idle]
clip = "idle"
frames = 12
fps = 8
loop = true
location_scale = 0.0

[anims.walk]
clip = "walk"
frames = 12
fps = 15
loop = true
location_scale = 0.0

# RUN IS THE WALK CLIP PLAYED FASTER, AND THAT IS DELIBERATE.
# `quadraped/deer_run_01.dae` is the one deer clip that does not transfer to
# this rig at all, and unlike the location-curve problem above it cannot be
# corrected by any recipe setting. Substituted 2026-08-28 after the owner
# flagged `run__N__0002` -- the forelegs come out as straight rods thrown
# sideways, most visible from N and S and nearly invisible side-on, where the
# splayed limb points at the camera and hides behind the body.
#
# THE TEST THAT NAMED IT, and it is the one to reuse: render ONE time sample
# (`frames = 1`, so `sample_positions()` puts every direction at clip position
# 0.0) across all five stored directions. Those five MUST be one rigid pose
# seen from five angles. `vis.wolf` passes it perfectly and is the control.
# The deer's idle, walk and death pass it too. Only `run` fails -- at position
# 0.0 it renders a mangled animal at S, a clean side view at SE and E, and a
# rearing one with a rod through it at NE and N. A pose that changes with the
# camera is not a pose problem the recipe can reach.
#
# Do not read this as "the deer cannot run". The walk clip transfers cleanly
# and at 22 fps reads as a trot, which is what a fleeing deer needs to look
# like; the alternative was shipping the rods. The `run` ANIM still exists in
# the atlas under its own name, so `AnimationSystem` needs no change.
[anims.run]
clip = "walk"
frames = 12
fps = 22
loop = true
location_scale = 0.0

[anims.die]
clip = "death"
frames = 10
fps = 12
loop = false
location_scale = 0.0

# Pinned to the clip's final pose: without it decay samples position 0.0,
# which is the death clip's FIRST frame -- the animal still standing -- so
# the corpse stands up for a frame before falling over again.
[anims.decay]
clip = "death"
frames = 2
fps = 1
loop = false
location_scale = 0.0
start = 1.0

