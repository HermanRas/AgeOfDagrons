# GENERATED FILE -- do not edit. Source: tools/recipes/scout_cavalry.toml
# Player 1: Blue #0043D6 (linear 0.0, 0.056128, 0.672443)
# Regenerate: python tools/gen_player_colour_recipes.py

# Scout cavalry -- the MAURYAN mounted swordsman (`maur/cavalry_swordsman_a`,
# PLAN.md 9.2). Age 1 spawns one and cannot train it; the Stable trains it from
# age 2.
#
# The header used to describe "a Briton mounted javelinist, the Celtic
# light/skirmishing horse", left over from the units-are-Celtic error (PLAN.md
# 2.7). The `source.actor` line was put back to the owner's Mauryan pick but the
# prose and the CLIP NAMES were not, and that is what broke the bake: a
# javelinist throws (`attack_ranged`), a swordsman strikes (`attack_melee`), and
# this actor declares no `attack_ranged` at all. Fixed 2026-08-15 after the bake
# failed ~10 minutes in.
#
# Cheap to have caught earlier, and now it is: `tools/check_clips.py` resolves
# every recipe's clip names against its actor's XML in about a second. Run it
# before a batch.
#
# Mounted units became bakeable at all on 2026-08-14: see knight.toml for why
# (subject-armature picking, then nested-prop clip resolution). Same structure --
# `_m` is the mount and carries its `_r` rider as a nested prop actor, and both
# skeletons are driven from their own actors.
#
# Canvas is deliberately generous. This is a first bake and the clip-check
# reports a canvas that is too small rather than silently cropping, so the cost
# of guessing high is a fuller atlas page, and the cost of guessing low is a
# wasted overnight slot.
id      = "vis.scout_cavalry.blue"
adapter = "zeroad"

[source]
# Player 1 (Blue, #0043D6). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [0.0, 0.056128, 0.672443]
actor = "units/mauryas/cavalry_swordsman_a_m.xml"

[render]
canvas = [384, 448]
supersample = 2
# 8, not 5 mirrored: sword and shield are one-sided (PLAN.md 2.5).
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
# attack_melee, not attack_ranged: this is a swordsman. The actor declares
# Idle/Walk/Run/attack_melee/attack_capture/attack_slaughter/death/gather_meat/
# promotion -- and no ranged attack of any kind.
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

