# Fishing ship, Dock from age 2 (PLAN.md 9.2). Celtic ships DO exist, which was
# not obvious: they live under art/actors/STRUCTURES/celts/ rather than units/,
# because 0 A.D. models ships as structures.
#
# VERIFIED CORRECT 2026-08-15 against the owner's pick, which resolves to the
# same actor this already used:
#
#   units/gaul/ship_fishing  ->  simulation/templates/units/gaul/ship_fishing.xml
#     -> <VisualActor><Actor>structures/celts/fishing_boat.xml</Actor>
#
# Its sibling transport_ship.toml was NOT so lucky (rowboat, should have been
# skiff), so this one matching was luck rather than method. No change needed.
#
# First ship baked, so nothing calibrates the canvas. Guessing high deliberately
# -- the clip-check reports a canvas that is too small rather than cropping
# silently, so a generous guess costs atlas space and a mean guess costs the bake.
id      = "vis.fishing_ship.cyan"
adapter = "zeroad"

[source]
# Player 4 (Cyan, #00E5FF). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
variant_seed = "vis.fishing_ship"
player_colour = [0.0, 0.783538, 1.0]
actor = "structures/celts/fishing_boat.xml"

[render]
canvas = [512, 512]
supersample = 2
# 8: a hull is not laterally symmetric once it has a sail and rigging on one side,
# and a mirrored boat would sail backwards. Verify on the turntable.
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

