# Spearman, from 0 A.D.'s Athenian hoplite -- first military unit
# (ASSET_MISSING.md 2.1).
#
# NEW PIPELINE DEFECT FOUND AND WORKED AROUND, 2026-08-08: the obvious pick,
# `infantry_spearman_a.xml`, uses mesh `skeletal/new/m_armor_tunic_short.dae`.
# That mesh imports through the Pyrogenesis importer with a "Biped" armature
# that has ZERO bones (`isobake inspect` confirms: "armature Biped (0 bones)"),
# despite the raw COLLADA import log showing every joint imported correctly --
# something in the importer's armature-building step drops all bones for this
# one mesh file. Every clip attach then silently fails (best_score is always
# 0 against an empty bone set) and the bake aborts with "Available: []".
# `infantry_spearman_b.xml` is otherwise identical (same base_hoplite.xml
# clips, same spear+shield props) but uses `skeletal/new/m_tunic_short.dae`,
# which imports with all 102 bones -- same mesh family as the working
# infantry_archer_a.xml and healer.xml. Confirmed by inspecting several
# Athenian actors: every one using `m_armor_tunic_short.dae` (spearman_a/c/e,
# javelinist_a/b, cavalry_swordsman_a_r/e_r, slinger_a/e, oxybeles, ballista)
# is equally affected; every one using `m_tunic_short.dae` or `m_dress.dae`
# is fine. Not fixed in isobake itself this pass -- picking a working actor
# was cheaper than debugging the Pyrogenesis importer's armature builder.
id      = "vis.spearman.green"
adapter = "zeroad"

[source]
# Player 5 (Green, #00A344). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
variant_seed = "vis.spearman"
player_colour = [0.0, 0.366253, 0.057805]
actor = "units/gauls/infantry_spearman_a.xml"
# The importer takes the first variant of each cosmetic group deterministically
# per recipe id (tunic colour) -- fine, this is cosmetic variety, not a
# correctness question like the tree size classes.

[render]
# `isobake inspect` measures 2.078 x 0.864 x 7.934 m raw -- the height figure
# is dominated by the spear held vertically, not the body (villager-scale,
# ~1.9-2.0 m). Canvas follows villager.toml's precedent of generous margin
# for a raised weapon rather than trying to compute the worst pose by hand.
canvas = [224, 224]
supersample = 4
# 8, not 5+mirrored: the spear is in weapon_R and the shield in shield_arm,
# both one-sided, so mirroring would swap which arm holds which (PLAN.md 2.5,
# same reasoning as the villager's axe).
directions = 8
frame_origin_at = 0.25
engine = "eevee"
samples = 24

# AOD animation ids on the left (PLAN.md 2.5), 0 A.D. clip names on the
# right. Clip names/files read directly from
# art/variants/biped/base_hoplite.xml and death_infantry.xml.
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

# base_hoplite.xml's two Attack_melee files (attack_melee_04/05.dae) are
# cosmetically-equivalent swing variants, same non-issue as villager.toml's
# Death pick -- no `file=` disambiguation needed.
[anims.attack]
clip = "Attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

# Same clip as `die`, not a separate source animation -- see villager.toml's
# identical note; 0 A.D. has no distinct decay/corpse clip.
[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

