#
# The previous pick, `hellenes/siege_lithobolos`, was chosen as a "closest
# analog" on the reasoning that 0 A.D. has no true counterweight trebuchet. That
# reasoning was sound and irrelevant: the roster had already named the actor, and
# nobody looked. A mangonel is not a counterweight trebuchet either -- but it is
# the one the project owner picked, and it comes with a real packed counterpart,
# which the lithobolos does not.
#
# NOT YET RE-BAKED. Canvas and clip names below were measured on the lithobolos;
# both need re-checking on the first bake, and the clip names especially, since
# the Han actor need not declare `attack_ranged` under that name.
#
# UNBLOCKED 2026-08-14. Was blocked because isobake picked the first armature it
# found, and for this actor that is one of the five crew operators (nested props,
# `units/hellenes/lithobolos_infantry_{a,b,c,d}.xml`) rather than the engine's own
# "Lithobolos_Armature". Two fixes had been tried and reverted: import order (the
# crew import first) and bone count (Blender reuses one armature datablock across
# similar crew imports, so a crew rig reports 202 bones against the engine's
# genuine 37).
#
# The finding that unlocked it: nested props are attached with CONSTRAINTS, not
# parenting -- both the Pyrogenesis importer and `_attach_prop` pin a prop's root
# with COPY_LOCATION/COPY_ROTATION -- so every prop armature is a parentless root
# too, and neither order, depth nor bone count can separate them. What does is the
# DIRECTION of those constraints: the subject is the one thing nothing anchors, so
# it is the constraint target and never the constrained. See `_subject_armature`.
#
# 11 armatures import here and 10 are correctly identified as anchored props.
id      = "vis.trebuchet.red"
adapter = "zeroad"

[source]
# Player 2 (Red, #D50032). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [0.665387, 0.0, 0.031896]
actor = "units/han/siege_mangonel.xml"
# The four crew props (`mangonel_operator_{a,b,c,d}`) reference clips Blender's
# COLLADA importer rejects, and driving nested figures is all-or-nothing per
# actor -- so one unloadable crew clip killed the whole bake, whichever
# animation was requested. This opts out: the ENGINE animates, the crew stand
# still. Project owner's call 2026-08-15 ("as long as the device is animated,
# it's okay if the man around it is static"), and it is strictly better than the
# alternative considered, which was to drop the crew entirely to match the ram.
drive_riders = false

[render]
# Raised from [384, 384] on 2026-08-15: that was the Hellenic lithobolos'
# figure and the Han mangonel is a bigger engine with four crew standing around
# it -- it lost static/S at 4.715 m subject height.
canvas = [512, 512]
supersample = 2
directions = 5
frame_origin_at = 0.2
engine = "eevee"
samples = 24

# ANIMATED AGAIN as of 2026-08-15, via `source.drive_riders = false` above.
#
# History worth keeping, because two reasonable-looking fixes both failed:
#   1. Disable `attack` -- no. ANY clip routes through `_drive_riders`, so idle
#      alone still tried to import the crew's clips and still died.
#   2. Ship fully static -- worked, but threw away the engine's own animation to
#      work around a defect in four props riding on it.
# The actual fix separates the two: the engine's armature is driven, the crew's
# are not.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.attack]
# Re-enabled with `drive_riders = false`. The engine's throwing arm animates;
# the four crew stand still through it.
#
# Not an XML problem, for the record -- every file in the crew's chain validates
# with XmlDocument.Load, including the 2.5 MB `mangonel_operator_attack_{a,b}.dae`.
# Blender's COLLADA importer rejects their CONTENT, which puts this in the same
# family as the other pinned-importer defects (the bone-less `m_armor_tunic_*`
# armatures, the nested-prop root bug).
clip = "attack_ranged"
frames = 12
fps = 15
loop = true

