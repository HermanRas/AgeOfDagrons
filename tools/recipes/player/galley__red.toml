# Galley -- the Athenian trireme, Dock from age 3 (PLAN.md 9.2).
#
# Re-pointed 2026-08-15 to the owner's actual pick, `athen/ship/arrow`. It had
# been guessed as the Celtic warship under the mistaken "units are Celtic in
# every age" reading (see knight.toml).
#
# `athen/ship/arrow` was reported missing because of the slash: the path is
# `athen/ship_arrow`, an entity TEMPLATE, and the actor is inside it --
#
#   simulation/templates/units/athen/ship_arrow.xml
#     -> <VisualActor><Actor>structures/athenians/trireme.xml</Actor>
#
# and yes, a ship's actor really does live under structures/ (see
# fishing_ship.toml).
#
# This also RETIRES the "one hull" problem in PLAN.md 9.2.1 item 9: the galleon
# is `ptol/ship_siege` -> structures/ptolemies/quinquereme.xml, a genuinely
# different and heavier hull, so age 3 and age 4 warships no longer have to
# share a sprite.
id      = "vis.galley.red"
adapter = "zeroad"

[source]
# Player 2 (Red, #D50032). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [0.665387, 0.0, 0.031896]
actor = "structures/athenians/trireme.xml"

[render]
# Sized in three steps, all on clip reports rather than by eye:
#   [640, 512] -- Celtic warship, 2 frames (S and N) touching the edge
#   [896, 640] -- Celtic warship, clean; then re-pointed to the trireme, which
#                 clipped 1 frame (static/N) at 9.458 m subject height
#   [896, 832] -- current
#
# Only the N frame clipped, and only vertically, so the width is already right
# and this raises height alone. A hull is long, so the bow-on and stern-on views
# are the tight ones -- not the broadside you would picture when guessing, which
# is exactly why this is measured and not estimated.
canvas = [896, 832]
supersample = 2
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

