# has no monks; a robed staff-carrying healer is the nearest analog and fits
# the Hellenic/Athenian consistency already chosen for buildings and the
# other military units). ASSET_MISSING.md 2.1.
#
# Uses `skeletal/new/m_dress.dae`, confirmed working (102 bones, same family
# as villager.toml and infantry_archer_a.xml) -- unaffected by the
# `m_armor_tunic_short.dae` bone-less-armature defect that blocked the first
# spearman.toml attempt. No shield, so the aspis nested-prop bug is moot too.
id      = "vis.monk.orange"
adapter = "zeroad"

[source]
# Player 7 (Orange, #FFAB00). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [1.0, 0.40724, 0.0]
actor = "units/athenians/healer.xml"
# 0 A.D. has no relic prop and no distinct relic-carrying variant for this
# actor -- ASSET_MISSING.md's "relic-carrying variant" ask has nothing to map
# to. `healer-robe-1`'s hooded-priest head is the only cosmetic variant this
# actor offers, and it's a plain random skin pick, not a relic.

[render]
# `isobake inspect` measures 1.980 x 2.907 x 4.389 m raw -- staff raised,
# similar scale to archer.toml's bow-drawn pose.
canvas = [192, 192]
supersample = 4
# 8, not 5+mirrored: the staff is in weapon_R, one-sided, same reasoning as
# every other armed unit baked so far (PLAN.md 2.5).
directions = 8
frame_origin_at = 0.25
engine = "eevee"
samples = 24

# Clip names/files read directly from
# art/variants/biped/base_healer_male.xml and death_infantry.xml.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

# 0 A.D. has no combat attack for a healer -- "Heal" is this unit's one
# action clip, and PLAN.md's animation vocabulary has no dedicated heal slot
# yet, so it stands in for `attack` here (closest analog, per the actor
# research this recipe is based on).
[anims.attack]
clip = "Heal"
frames = 12
fps = 12
loop = true

# No unique death clip for this actor -- reuses death_infantry.xml, same
# treatment as villager.toml's Death pick.
[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

