# Villager -- `units/celts/female_citizen`, which IS the Briton female citizen.
#
# This actor has now been changed three times and the middle change was wrong in
# an instructive way, so the history is worth keeping:
#
#   athenians/female_citizen -> celts/female_citizen -> britons/citizen_female
#                                                    -> celts/female_citizen
#
# The third move was made earlier on 2026-08-15, reasoning that the roster says
# "Brit/support_civilian", so a Briton actor must be more correct than a Celtic
# one, and `units/britons/citizen_female.xml` exists. It does exist. It is not
# what 0 A.D. uses for a Briton citizen:
#
#   simulation/templates/units/brit/support_female_citizen.xml
#     -> <VisualActor><Actor>units/celts/female_citizen.xml</Actor>
#
# Britons and Gauls SHARE one female citizen actor and it lives under celts/.
# Worse, the substitute was not neutral: `britons/citizen_female.xml` carries the
# same mesh and the same head prop but dresses her in `skeletal/germ/
# dress_female_*` textures -- a Germanic dress on a Briton villager. So the
# reasoning "the roster says Brit, therefore prefer the file with britons in its
# path" produced a worse result than leaving it alone would have. That is the
# whole argument for resolving templates instead of pattern-matching directory
# names, and it is worth more than the fix.
#
# PLAN.md 2.5: one villager, one gender.
#
# This is the phase 0.9 proof: an animated, skinned character with the
# animation attached from a separate .dae. Everything else in the pipeline was
# already working on static assets.
#
# NEEDS A 960-FRAME RE-BAKE, and is deliberately held out of the 2026-08-15
# batch so it can be spent once rather than twice. Two other pending changes want
# the same re-bake: the canvas can drop from [160,160] to about [96,96] (see the
# note below), and PLAN.md 13.2 item 9's `height_m` override is the fix that
# becomes free the moment her frames are re-rendered anyway. `height_m` stays
# UNSET here -- the project owner deferred it explicitly on 2026-08-08, and this
# file does not get to reverse that quietly.
id      = "vis.villager.yellow"
adapter = "zeroad"

[source]
# Player 3 (Yellow, #FFEB00). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [1.0, 0.83077, 0.0]
actor = "units/celts/female_citizen.xml"

[render]
# A 1.9 m villager is 1.9 * cos(30) * 22.627 = 37px of body, and the raised
# tools reach higher, so the canvas is set from measured sprite extents rather
# than from body height.
#
# 160 was chosen against measurements taken while the object-transform bug was
# live (isobake c540874): every clip's action reset the armature's x0.5 unit
# conversion to 1.0, so the villager baked at double size and appeared to need
# ~82px above the anchor and ~38px below. Re-measured off a correct bake, the
# real worst cases are work_mine at 58px above, 13px below, and 32px to the
# side.
#
# 160 with frame_origin_at = 0.28 (115px above, 45px below, 80px each side) is
# therefore about 4x more canvas than needed. It is not wrong -- trimming and
# packing drop the empty margin, so the atlas and its anchors are correct
# either way -- only wasteful in render time and intermediate frame size.
# canvas = [96, 96] with frame_origin_at = 0.25 (72px / 24px) still clears
# every pose; fold that in at the next re-bake rather than re-rendering 960
# frames for it alone.
canvas = [160, 160]
supersample = 4
# 8, not 5+mirrored: work_chop holds an axe in weapon_L and walk_carry_wood
# carries wood in weapon_R (PLAN.md 2.5), and mirroring would swap which hand
# holds it. `directions` is decided per recipe, not per animation, so idle and
# walk render at 8 too even though they'd be mirror-safe alone.
directions = 8
frame_origin_at = 0.28
engine = "eevee"
samples = 24

# AOD animation ids on the left (PLAN.md 2.5), 0 A.D. clip names on the right.
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.work_chop]
clip = "gather_tree"
frames = 12
fps = 12
loop = true

# Named by file, not by clip name: 0 A.D. declares another `Walk` inside each
# carry variant, and a name lookup can only return one of them.
[anims.walk_carry_wood]
file = "biped/gatherer/carry_wood_f.dae"
frames = 12
fps = 15
loop = true

# 0 A.D.'s "metal" is AOD's gold. `clip` names the variant (not an animation --
# file already picks that), because carry_stone shares this exact walk file and
# would otherwise win the props lookup: a rock shuttle instead of an ore one.
[anims.walk_carry_gold]
clip = "carry_metal"
file = "biped/gatherer/carry_ore_f.dae"
frames = 12
fps = 15
loop = true

[anims.walk_carry_food]
file = "biped/gatherer/carry_grain_f.dae"
frames = 12
fps = 15
loop = true

# gather_rock and gather_ore share one file (gathering gold or stone is the
# same animation in 0 A.D.); the name only picks which prop set applies, and
# both hold the same pick.
[anims.work_mine]
clip = "gather_ore"
frames = 12
fps = 12
loop = true

[anims.work_hunt]
clip = "gather_meat"
frames = 12
fps = 12
loop = true

[anims.work_build]
clip = "Build"
frames = 12
fps = 12
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

# Same clip as `die`, not a separate source animation -- 0 A.D. has no distinct
# decay/corpse clip (PLAN.md 4.7 fades the corpse in-engine over 10s, it does
# not animate one). frames = 2 rather than 1 because sample_positions() always
# puts a single frame at position 0.0 (the clip's start); 2 is the cheapest way
# to land frame index 1 on position 1.0, the actual collapsed rest pose.
[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

