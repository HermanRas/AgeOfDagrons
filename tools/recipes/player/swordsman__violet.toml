# Swordsman -- Gaulish infantry swordsman, Barracks from age 2 (PLAN.md 9.2).
# Britons ship only a `_c` tier, so Gauls it is; both are Celtic and units do not
# re-skin per age.
#
# Same mesh family as vis.spearman, which bakes clean, so this should not hit the
# bone-less `m_armor_tunic_short.dae` defect (spearman.toml's note). If it does,
# the `_b` variant is the substitute to try.
id      = "vis.swordsman.violet"
adapter = "zeroad"

[source]
# Player 6 (Violet, #B44DFF). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
variant_seed = "vis.swordsman"
player_colour = [0.456411, 0.074214, 1.0]
actor = "units/gauls/infantry_swordsman_a.xml"
# TWO BODIES, fixed 2026-08-16. The actor declares a mesh in two groups: the
# Base variant's `m_armor_pants_tunic_short` and, in a later group, the
# Gallic-Linothorax variant's `m_armor_pants_tunic_long`. 0 A.D. resolves an
# actor to ONE variant per group and a later mesh REPLACES the base; the pinned
# importer instead imports both, each under its own Biped armature. They share a
# rest pose, so the unit looks correct standing and splits into two overlapping
# corpses as it falls -- which is how this was finally spotted, in the death
# animation rather than in any of the 8 idle contact sheets.
#
# Dropping the LONG one, not the short, even though 0 A.D.'s own semantics would
# keep it: the importer anchors everything else -- the cape, and the 63-bone
# `Armature` that actually drives the unit -- to the SHORT mesh. The long one is
# parented to a stray `Biped.001` and nothing references it. Its armature is left
# behind deliberately; `drop_objects` matches on the base name, so listing
# "Biped.001" would also delete "Biped" and take the real body with it. An
# armature with no mesh renders nothing.
drop_objects = ["m_armor_pants_tunic_long"]

[render]
canvas = [224, 224]
supersample = 2
# 8: sword and shield are one-sided, so mirroring would swap hands (PLAN.md 2.5).
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

