# Galleon -- the age-4 heavy warship, Dock (PLAN.md 9.2). NEW 2026-08-15: the
# roster has always named it and no recipe existed, so `unit.galleon` had no art
# at all rather than placeholder art.
#
# The project owner's pick, resolved through its template:
#
#   units/ptol/ship_siege  ->  simulation/templates/units/ptol/ship_siege.xml
#     -> <VisualActor><Actor>structures/ptolemies/quinquereme.xml</Actor>
#
# A quinquereme is a genuinely heavier hull than the galley's Athenian trireme,
# which RETIRES a worry PLAN.md 9.2.1 item 9 carried for a day: under the
# (mistaken) units-are-Celtic rule the Celts shipped exactly one warship, so
# galley and galleon could not have differed without going outside the set. They
# were never restricted to it. Age 3 and age 4 warships are visibly different
# ships, which is what an age upgrade should look like.
id      = "vis.galleon.yellow"
adapter = "zeroad"

[source]
# Player 3 (Yellow, #FFEB00). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [1.0, 0.83077, 0.0]
actor = "structures/ptolemies/quinquereme.xml"

[render]
# Unmeasured. Sized by interpolation from the other hulls rather than guessed
# blind: the Celtic warship needed [896, 640] and reported two clipped frames at
# [640, 512], and the bow-on/stern-on views are the tight ones on a long hull --
# not the broadside, which is the one you would size for by eye. A quinquereme is
# the biggest ship in the roster, so this starts above the warship's figure.
#
# Read the clip report on the first bake. A canvas that is too small is reported
# rather than silently cropped, so guessing high costs atlas space and guessing
# low costs the bake.
#
# First bake clipped 2 frames (static/S and static/N) at [1024, 768], subject
# height 10.123 m -- the bow-on and stern-on views, exactly as predicted above.
# Raised height only; width was clean. The galley needed 832 at 9.458 m, so a
# 10.123 m hull wants proportionally more.
canvas = [1024, 1024]
supersample = 2
# 8, not 5+mirrored: a hull is not laterally symmetric once it carries a sail and
# rigging, and a mirrored ship sails backwards. Same reasoning as every other
# vessel in the set.
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

