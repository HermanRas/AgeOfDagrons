# Crossbowman -- which throws a javelin, because the Celts have no missile weapon
# but the sling and the javelin (PLAN.md 9.2.1 item 8). The `_e` elite tier of the
# Gaulish javelinist, so the ranged ladder reads as a progression:
#   militia   britons/infantry_slinger_a     (sling)
#   archer    gauls/infantry_javelinist_a    (javelin)
#   crossbow  gauls/infantry_javelinist_e    (javelin, elite kit)
#
# Whether three ranged units differing only by tier is acceptable is the open
# question in 9.2.1 item 8. This bakes the Celtic answer so it can be judged
# against the alternative rather than argued about.
id      = "vis.crossbowman.orange"
adapter = "zeroad"

