# Player 8: White #FFFFFF (linear 1.0, 1.0, 1.0)
# Regenerate: python tools/gen_player_colour_recipes.py

# Archer, from 0 A.D.'s Athenian archer -- second military unit
# (ASSET_MISSING.md 2.1). Uses `skeletal/new/m_tunic_short.dae`, confirmed
# working (102 bones) unlike the `m_armor_tunic_short.dae` family that
# blocked the first spearman.toml attempt (PLAN.md 13.2 / see spearman.toml's
# note) -- same rig family as villager.toml and healer.xml.
#
# Its shield (`pelte_cretan_bronze_01.xml`) does NOT hit the nested-prop
# root-attachment bug that spearman's aspis shield did: its <mesh> comes
# before its nested <props> in the same variant (so the importer's rootObject
# is already set correctly by the time it recurses), and the nested back
# piece attaches at a named point ("back"), not "root". Confirmed by reading
# the prop actor's XML before baking, not by trial and error.
id      = "vis.archer.white"
adapter = "zeroad"

[source]
# Player 8 (White, #FFFFFF). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [1.0, 1.0, 1.0]
actor = "units/carthaginians/infantry_archer_a.xml"

[render]
# `isobake inspect` measures 2.303 x 2.947 x 4.449 m raw -- smaller than the
# spear-inflated 7.934 m of spearman.toml (a drawn bow doesn't reach nearly as
# far as a raised spear), so a smaller canvas suffices.
canvas = [192, 192]
supersample = 4
# 8, not 5+mirrored: the bow is in weapon_bow (one side) and the quiver/arrow
# on the back/weapon_R, same reasoning as the villager's axe and the
# spearman's spear+shield (PLAN.md 2.5).
directions = 8
frame_origin_at = 0.25
engine = "eevee"
samples = 24

# Clip names/files read directly from art/variants/biped/base_archer_relax.xml,
# attack_ranged_archer.xml and death_infantry.xml.
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

# attack_ranged_archer.xml's four ids are the same file (attack_ranged.dae),
# so clip="attack_ranged" resolves unambiguously -- same non-issue as
# spearman.toml's Attack_melee pick. `event="0.45" load="0.72"` in the source
# marks where the arrow release actually happens; not consumed by this
# recipe format, noted for whoever wires up projectile timing later.
[anims.attack]
clip = "attack_ranged"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

