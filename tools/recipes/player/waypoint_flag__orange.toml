# Player 7: Orange #FFAB00 (linear 1.0, 0.40724, 0.0)
# Regenerate: python tools/gen_player_colour_recipes.py

# Waypoint flag -- the marker dropped where a player sends a unit or sets a
# rally point. Project owner's request, 2026-08-27: one per player colour.
#
# THE ACTOR CHOICE IS THE WHOLE DECISION HERE, and 0 A.D. offers seventeen
# waypoint flags of which only one is any use to us:
#
#   <civ>_waypoint_flag.xml   fifteen of them -- rome, brit, athen, ...
#                             ALL `basic_trans_norm_spec` with a fixed civ
#                             banner texture (banner_romans.png etc). They are
#                             civ emblems, not player markers: every player
#                             would fly the same flag.
#   waypoint_flag_factions    also basic_trans, Achaemenid banner. Same problem.
#   waypoint_flag_0ad         `player_trans_norm_spec`, a neutral banner texture
#                             (wrld_waypoint_flag.dds), and an Idle clip.  <- THIS
#
# MEASURED, not assumed, per AGENT_ASSET.md 4 -- a material name predicts a tint
# in neither direction. White against blue at `directions = 1`:
#
#   opaque 4881 px, 3681 moved by more than 64, largest channel delta 235
#   => 75.4% OF THE SPRITE TINTS
#
# That is the strongest player-colour surface in the project by some way
# (transport_ship 10.1%, siege_ram 6.8%, onager 4.7%), which is what you would
# expect of something that is almost entirely banner cloth. `"colours": true`,
# emphatically.
id      = "vis.waypoint_flag.orange"
adapter = "zeroad"

[source]
# Player 7 (Orange, #FFAB00). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [1.0, 0.40724, 0.0]
actor = "props/special/common/waypoint_flag_0ad.xml"

[render]
# inspect: 2.079 x 0.358 x 6.031 m, so it renders 118.2 px tall at 22.627 px/m.
# 192 leaves headroom for the cloth to lift on the idle without clipping; the
# probe filled 31.5% of a single frame, so there is room and no waste worth
# chasing.
canvas = [128, 192]
supersample = 4
# 1, not 5 or 8: a marker has no facing. It is dropped on the ground and the
# camera never orbits, so eight renders of a flagpole would be eight copies of
# one picture. This is the same call as a tree or a ground tile.
directions = 1
frame_origin_at = 0.1
engine = "eevee"
samples = 24
# NOT SET, deliberately. `yaw_offset_deg = 180` is the zeroad adapter
# correction that every FACING subject needs -- but at `directions = 1` the
# yaw is the whole rotation, so a half-turn here would simply spin the banner
# to face away from the camera. Nothing to cancel when nothing turns.

# The banner waves. `garrison_flag_idle.dae`, the actor's only clip, and the
# one thing that makes a rally marker read as alive rather than as a decal.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

