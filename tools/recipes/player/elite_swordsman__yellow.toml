# Elite swordsman, Castle from age 4 (PLAN.md 9.2).
#
# Re-pointed 2026-08-15 to the owner's actual pick, `athen/champion_marine` --
# the Athenian Marine. It had been guessed as the Gaulish `_e` tier under the
# mistaken "units are Celtic in every age" reading (see knight.toml for how that
# error happened); units keep their hand-picked mixed-civ actors.
#
# `athen/champion_marine` is an entity TEMPLATE, not an actor -- 0 A.D. ships no
# champion_* actor files at all, which is why this was reported missing. The
# actor is inside it:
#
#   simulation/templates/units/athen/champion_marine.xml
#     -> <VisualActor><Actor>units/athenians/infantry_swordsman_c.xml</Actor>
#
# Note the tier is `_c` (citizen), not `_e`: 0 A.D. dresses its Athenian
# champion in the citizen-tier swordsman mesh and makes it a champion through
# stats alone. So this no longer reads as "the elite tier of the basic
# swordsman" -- vis.swordsman is `gauls/infantry_swordsman_a` and this is a
# visibly different soldier, which is arguably better for a Castle unit.
id      = "vis.elite_swordsman.yellow"
adapter = "zeroad"

[source]
# Player 3 (Yellow, #FFEB00). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [1.0, 0.83077, 0.0]
actor = "units/athenians/infantry_swordsman_c.xml"
# TWO BODIES, fixed 2026-08-16 -- see swordsman.toml for the full diagnosis; the
# same multi-group mesh declaration, but this one is worse and its fix inverts.
#
# The base variant is `m_tunic_short` and a later group overrides it with
# `m_armor_tunic_short` -- which is the BONE-LESS mesh spearman.toml documents,
# the one the importer builds with a zero-bone armature. So the duplicate cannot
# animate at all: it holds the rest pose while the real body dies, and the unit
# renders as a soldier standing bolt upright on top of his own corpse.
#
# NOT FIXED, and deliberately left alone -- every available option is broken in
# a different way, so the known breakage stays until the real one is done.
# Measured 2026-08-16:
#
#   drop_objects = ["m_armor_tunic_short"]  the corpse disappears and the unit
#                                           stands upright through its own death
#   drop_objects = ["m_tunic_short"]        the body falls correctly but the
#                                           helmet and shield stay in mid-air
#   (nothing)                               today's behaviour: an upright,
#                                           fully-equipped soldier standing on
#                                           his own falling corpse
#
# The cause of the middle case is the real problem: the props are constrained to
# `Biped`, the armature of the mesh that does NOT animate, while the body that
# does animate hangs off `Biped.002`. Dropping either mesh leaves props bound to
# the wrong rig. The fix is to rebind prop constraints onto the animating
# armature, which is importer/adapter work, not a recipe value.
#
# Substituting an actor does not help either: spartans/infantry_swordsman_c is
# single-mesh but `isobake inspect` reports `Biped (0 bones)` -- the bone-less
# import defect -- so it would abort the bake, and macedonians/..._c_thracian
# has the same two-group mesh declaration.
#
# swordsman.toml IS fixed; only this one needs the deeper change.

[render]
canvas = [224, 224]
supersample = 2
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

