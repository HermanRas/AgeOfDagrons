# Battering ram, Siege Workshop from age 3 (PLAN.md 9.2).
#
# Re-pointed 2026-08-15 to the IBERIAN ram, which is the project owner's pick
# resolved properly:
#
#   units/cart/siege_ram  ->  simulation/templates/units/cart/siege_ram.xml
#     -> <VisualActor><Actor>structures/iberians/siege_ram.xml</Actor>
#
# Note the roster line says `cart` and the actor is `iberians` -- 0 A.D.'s
# Carthaginian ram template borrows the Iberian art. That mismatch between the
# civ in the template path and the civ in the actor path is exactly why these
# have to be resolved rather than guessed, and it is why the previous Roman
# pick looked defensible.
#
# The whole justification this file used to carry -- "no Athenian/Hellenic ram
# exists, so this breaks the civ consistency kept everywhere else, flagged not
# fixed" -- was answering a question nobody asked. Civ consistency is a rule for
# ARCHITECTURE only (PLAN.md 13.2 item 2); units are deliberately mixed-civ and
# always were. There was never anything to apologise for, and the roster had the
# answer the whole time.
#
# Mechanical (rigid, non-skeletal) rig, so none of the biped/quadruped defects
# found on the infantry/cavalry units apply. Animations are declared inline in
# the actor's own top group rather than via separate variant files.
#
# NOT YET RE-BAKED -- canvas and clip names below were measured against the
# Roman ram and both need re-checking against the Iberian one on the first bake.
id      = "vis.siege_ram.red"
adapter = "zeroad"

[source]
# Player 2 (Red, #D50032). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [0.665387, 0.0, 0.031896]
actor = "structures/iberians/siege_ram.xml"

[render]
# `isobake inspect` measures 7.024 x 14.736 x 8.607 m raw -- a genuinely large
# siege engine, comparable to a small building.
canvas = [384, 384]
supersample = 2
# The ram carries a shield on each side (shield_left/shield_right) --
# symmetric left-right, so mirroring is safe here unlike every armed
# infantry/cavalry unit baked so far.
directions = 5
frame_origin_at = 0.2
engine = "eevee"
samples = 24

# Clip names/files read directly from the actor's own inline <animations> --
# no separate variant file to check this time.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_melee"
frames = 12
fps = 15
loop = true

# No death clip exists -- 0 A.D. only plays a destruction-dust particle on
# this actor's death, no distinct pose. Same non-issue as the building
# roster having no damaged tier: rubble/removal covers it at the game-state
# level, not with a posed death animation. `die`/`decay` reuse the frozen
# Idle pose rather than mapping to nothing.
[anims.die]
clip = "Idle"
frames = 2
fps = 1
loop = false

[anims.decay]
clip = "Idle"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

