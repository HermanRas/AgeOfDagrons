#
# Not the research pick (`infantry_javelinist_a.xml`): every Athenian/Hellenic
# javelinist and slinger except `infantry_slinger_b.xml` uses
# `skeletal/new/m_armor_tunic_short.dae`, which imports with a bone-less
# armature (see spearman.toml's note -- same defect, checked here first
# rather than repeating the trial-and-error). `infantry_slinger_b.xml` uses
# the working `m_tunic_short.dae` mesh and is the only Athenian/Hellenic
# basic-ranged-skirmisher actor that does.
id      = "vis.militia.cyan"
adapter = "zeroad"

[source]
# Player 4 (Cyan, #00E5FF). Generated by
# tools/gen_player_colour_recipes.py -- edit that, not this.
player_colour = [0.0, 0.783538, 1.0]
actor = "units/britons/infantry_slinger_a.xml"

[render]
# `isobake inspect` measures 1.929 x 0.824 x 4.300 m raw -- similar scale to
# archer.toml/monk.toml.
canvas = [192, 192]
supersample = 4
# 8, not 5+mirrored: the sling is in weapon_R, one-sided (PLAN.md 2.5).
directions = 8
frame_origin_at = 0.25
engine = "eevee"
samples = 24

# Clip names/files read directly from
# art/variants/biped/base_slinger_ready.xml and death_infantry.xml. The sling
# + slingrock props are declared inside base_slinger_ready.xml's own
# <props>, not the top-level actor -- same "prop lives in the animation
# variant file" pattern as the villager's gather tools.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_ranged"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "Death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "Death"
frames = 2
fps = 1
loop = false
# Pinned to the clip's final pose 2026-08-16. Without this, decay's first
# frame is Death at t=0 -- the unit still standing -- so the corpse stood up
# for one frame before falling over again. See isobake AnimSpec.start.
start = 1.0

