# Archery range -- AGE 2 (Age of Embers), the Gaulish/German skin (PLAN.md 2.7, 9.2).
#
# Generated 2026-08-15 with the rest of the age-2 building pass. Buildings carry
# the age; units do not.
#
# Actor resolved through its entity template, never guessed from a filename:
#   simulation/templates/structures/gaul/range.xml -> <VisualActor><Actor>
#
# Render settings inherited from `archery_range.toml`. Canvas by interpolation:
# a same-role building at the same footprint frames within the same box, and the
# clip-check reports a canvas that is too small rather than cropping silently --
# so read the first bake's report rather than trusting this.
id      = "vis.archery_range_age2"
adapter = "zeroad"

[source]
actor = "structures/gauls/range.xml"

[render]
canvas = [512, 384]
supersample = 4
directions = 1
frame_origin_at = 0.4
ground_clip = true
engine = "eevee"
samples = 32
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/gauls/range.xml"
