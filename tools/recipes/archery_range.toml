# Archery range, from 0 A.D.'s Hellenic range (shared art across Hellenic civs;
# Athenians declare no override, per simulation/templates/structures/athen/range.xml).
id      = "vis.archery_range"
adapter = "zeroad"

[source]
actor = "structures/hellenes/range.xml"

[render]
# inspect measures 18.914 raw units tall -> 9.46 m -- already 185px at
# height*cos(30)*ppm alone, which left only 176px of headroom at the original
# 320/0.45 and clipped a chimney finial off the top (caught by `isobake bake`'s
# too-small-canvas check, not by eye). Raising to 384 fixed the top but the
# actor also has an open training-yard enclosure wider than estimated: its
# perimeter walls were still touching both the left and right edges (568 and
# 305 solid pixels respectively, not antialiasing noise) at 384 wide.
canvas = [512, 384]
supersample = 4
directions = 1
frame_origin_at = 0.4
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/hellenes/range.xml"
