# Cliff FAR edge, DIAGONAL MEDIUM -- 6 diagonal steps.
#
# `cliff_back_diag.toml` carries the whole argument: why a diagonal piece exists, why its
# span is a tile diagonal and its offset a half-diagonal, and that only the four
# 45-degree frames are usable. `cliff_face_short.toml` carries why the set has
# lengths at all. Neither is repeated here -- only `size_metres[0]` and
# `canvas` differ from the one-step piece.
#
# 6 diagonal steps = 16.971 m, against the axis set's 6 tiles = 12.0 m. The two
# ladders are the same COUNT and different lengths, which is #122's diagonal
# arithmetic showing up again: a diagonal step is 2.83 m where an axis step is 2.0.
id      = "vis.cliff_back_diag_medium"
adapter = "composite"

[[source.parts]]
name    = "crest"
adapter = "terrain"
texture = "Cliff_Gen/prepared/cliff_v2_s1_crest.png"

size_metres    = [16.971, 5.30]
texture_metres = [16.0, 5.30]
pitch_deg      = 75.0
# x = 1.414, not 0.0. An EVEN-step run anchors between tiles; half a diagonal
# step moves it onto one. `cliff_face_diag_medium.toml` carries the arithmetic,
# why the game side cannot fix it, and why `frame_origin_at` is the wrong knob.
# ⚠️ This piece must move with the face's -- a near edge and a far edge of one
# plateau register by construction only while their geometry matches.
offset_m       = [1.414, -1.414, -1.96]

[render]
canvas = [576, 512]
supersample = 4
directions = 8
frame_origin_at = 0.5
engine = "eevee"
samples = 32

[attribution]
