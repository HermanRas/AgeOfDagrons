# Galley -- the Celtic warship, Dock from age 3 (PLAN.md 9.2).
#
# This is also the GALLEON's only candidate: the Celts ship exactly one warship
# hull, so age 4's heavy warship cannot differ from age 3's without going outside
# the Celtic set (9.2.1 item 9). Baking this one first so the decision is made
# looking at the sprite rather than at the file listing.
id      = "vis.galley"
adapter = "zeroad"

[source]
actor = "structures/celts/warship.xml"

[render]
# Raised from [640, 512] on 2026-08-15: the first bake reported 2 frames (S and N)
# touching the render edge. A hull is long, so the bow-on and stern-on views are
# the tight ones -- not the broadside you would picture when guessing.
canvas = [896, 640]
supersample = 2
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/celts/warship.xml"
