# Sword cavalry -- Gaulish mounted swordsman, Stable from age 3 (PLAN.md 9.2).
# The `_a` basic tier; the `_e` elite tier of the same actor is vis.knight.
#
# See knight.toml for the composite-unit machinery this depends on.
id      = "vis.sword_cavalry"
adapter = "zeroad"

[source]
actor = "units/gauls/cavalry_swordsman_a_m.xml"

[render]
canvas = [384, 448]
supersample = 2
directions = 8
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

[anims.attack]
clip = "attack_melee"
frames = 12
fps = 15
loop = true

[anims.die]
clip = "death"
frames = 10
fps = 12
loop = false

[anims.decay]
clip = "death"
frames = 2
fps = 1
loop = false

