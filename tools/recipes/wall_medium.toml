# Wall segment, from 0 A.D.'s Athenian stone curtain wall (medium piece).
# See wall_short.toml for why this is an ordinary single-sprite bake, not a
# tiling problem.
id      = "vis.wall_medium"
adapter = "zeroad"

[source]
actor = "structures/athenians/wall_medium.xml"
# simulation/templates/structures/athen/wall_medium.xml: Square 25x6 world
# units -> 12.5x3 m, on FoundationActor structures/fndn_6x3_wall.xml and
# SpawnEntityOnDeath rubble/rubble_stone_wall_medium.

[render]
# inspect measures 24.236 x 5.610 x 23.080 raw units -> 12.12 x 2.81 x 11.54 m
# -- same height and depth as wall_short, just longer.
# First two attempts at [448,384] and [576,384] both clipped -- the
# (length+depth) footprint formula that sized wall_short.toml correctly
# undershoots here; the actual mesh extends past the plain footprint box
# (crenellations or coping overhang not captured by that formula). Cleared at
# [900,700], found by a large jump rather than more formula guessing.
canvas = [900, 700]
supersample = 4
# 4 directions, not 1 (2026-08-15, project owner). A wall is not a building:
# buildings sit at one fixed orientation, walls RUN -- they enclose a base, so
# every piece has to be placeable along either diagonal and facing either way.
# One sprite cannot do that. 4 evenly-spaced yaws is the whole wall vocabulary.
#
# Costs 4x the frames but NOT a bigger canvas: in a 2:1 isometric projection the
# two diagonals project to mirror-image bounding boxes of identical size, so the
# canvas measured for the current orientation still holds at 90/180/270. Read
# the clip report on the first bake anyway rather than trusting that.
directions = 4
frame_origin_at = 0.15
ground_clip = true
yaw_offset_deg = 180.0
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
