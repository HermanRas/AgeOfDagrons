# Deer carcass, requested by agent 1 in asset_request.md 2026-08-08 -- the
# depleted-state visual for `res.deer` (PLAN.md 6.1a/6.2).
#
# ---------------------------------------------------------------------------
# CORRECTED 2026-08-28: `location_scale` is 0.0, not 0.0319. The owner reported
# "deer is messed up, so is dead deer" from play. deer.toml carries the full
# reasoning and the measurements -- read it before touching this figure.
#
# THIS FILE IS WHERE 0.0319 CAME FROM, and its own account of how records the
# mistake exactly: the value was found "by probing values from 0.022 to 0.045
# and eyeballing the render". **The search range never contained the answer**,
# so it returned the least-bad point in the range, and the residual it left --
# described here for a fortnight as "a small tear at the neck/antler seam ...
# reads as a pose/skinning-weight seam, not a location-curve scale error" --
# was the defect itself, not a separate one. The note that it "does not track
# with the scale value" was the clue and was read as exoneration.
#
# The old header's mechanism was wrong too, and it is worth saying so because
# it sounds authoritative: it claimed the mesh and clip "declare the same
# <unit> but the two import paths honour it differently". They do both declare
# `<unit meter="0.0254">` (deer is the only animal in the roster authored in
# inches; wolf and boar are metres). But applying that very factor, 0.0254, was
# probed on 2026-08-28 and is ALSO wrong -- it barely moves the distortion. A
# clip's non-root pose-bone LOCATIONS simply do not transfer between two rigs;
# only rotations do. There is no correct multiplier.
#
# Nothing here "unblocks future quadruped clips" either -- the other five
# species need no correction at all, because their clips share their mesh's
# rig. Do not go looking for a per-species figure; look at whether the clip
# rig matches the actor's.
# ---------------------------------------------------------------------------
id      = "vis.deer_carcass"
adapter = "zeroad"

[source]
actor = "fauna/deer.xml"
# Same variant pick as vis.deer (first-of-group => male): antlers, and
# deer_death_01.dae over the female's _02 clip for consistency with the
# already-shipped standing sprite.

[render]
# Probed unclipped at 192x192 (see deer_carcass_probe.toml, since deleted);
# a collapsed quadruped is wider and flatter than the standing 128x128 canvas
# vis.deer uses, hence the bump.
canvas = [192, 192]
supersample = 4
# 5 stored, mirrored to 8, same as vis.deer/vis.boar/vis.sheep/vis.wolf --
# keeps this consistent with how the game consumes every other resource-node
# visual, even though the collapsed pose is no longer bilaterally symmetric
# (mirroring flips which side it fell on; accepted, still reads as "a dead
# deer" either way).
directions = 5
frame_origin_at = 0.15
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[anims.carcass]
clip = "death"
# frames = 2, not 1: sample_positions() always puts a lone frame at position
# 0.0 (the clip's start, near-standing); 2 is the cheapest way to also land
# frame index 1 on position 1.0, the actual collapsed pose (same trick as
# villager.toml's `decay`). Only frame 1 is the one that matters here.
frames = 2
fps = 1
loop = false
location_scale = 0.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/fauna/deer.xml"
