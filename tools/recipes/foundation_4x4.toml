# Building site for a 4x4-tile footprint -- the house's foundation.
# See foundation_8x8.toml for why these are keyed by footprint size.
id      = "vis.foundation_4x4"
adapter = "zeroad"

[source]
actor = "structures/fndn_4x4.xml"
# 0 A.D.'s own pairing: template_structure_civic_house_big declares
# <FoundationActor>structures/fndn_4x4.xml</FoundationActor>.

[render]
# Measured off an unclipped probe: 266 x 160, 93 px above the anchor and 67
# below -- 9 x 9 m of dirt decal, only 2.3 m of it standing up.
canvas = [320, 192]
supersample = 4
directions = 1
frame_origin_at = 0.42
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/fndn_4x4.xml"
