# Building site for a 3x3-tile footprint -- the lumber camp's foundation.
# See foundation_8x8.toml for why these are keyed by footprint size.
id      = "vis.foundation_3x3"
adapter = "zeroad"

[source]
actor = "structures/fndn_3x3.xml"
# simulation/templates/structures/hele/storehouse.xml declares this as its
# FoundationActor.

[render]
# inspect: 15.041 x 14.129 x 4.624 m. Canvas interpolated from the
# fndn_4x4/fndn_8x8 calibration pair, slightly smaller than fndn_4x4.
canvas = [320, 208]
supersample = 4
directions = 1
frame_origin_at = 0.45
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/fndn_3x3.xml"
