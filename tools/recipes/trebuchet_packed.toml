# Trebuchet (PACKED state) -- the travelling half of the pack/unpack state
# machine, PLAN.md 9.2.1 item 5, scoped with 4.13. asset_request.md P2.
#
# Pairs with trebuchet_deployed.toml. The roster names two actors, not one actor
# in two poses:
#
#   units/han/siege_mangonel_unpacked -> units/han/siege_mangonel.xml
#   units/han/siege_mangonel_packed   -> units/han/siege_mangonel_pivot_packed.xml
#
# ...AND THIS RECIPE DELIBERATELY DOES NOT USE THAT SECOND ACTOR. It bakes the
# wagon the pivot carries, one level down. Read the next section before
# "correcting" [source] back to the pivot.
#
# ---------------------------------------------------------------------------
# WHY THE WAGON AND NOT THE PIVOT (2026-08-28)
#
# This shipped STATIC from 2026-08-27, and the reason recorded here at the time
# was wrong in a way that would have cost the next session a day. It said the
# pivot declares no animations, so the subject's clip set comes up empty, and
# the fix was "teach the zeroad adapter to merge a nested prop's animations into
# the subject's clip set -- a real change". Both halves of that are false:
#
#   - The missing DECLARATION was never the blocker. `file = "..."` bypasses the
#     lookup entirely, which is what onager.toml does, and this recipe did too.
#   - The bake got past that and failed one step LATER, at zeroad.py's
#     "yielded no action that drives this armature". `Available: []` is the
#     downstream symptom of an empty clip dict, not evidence about declarations.
#
# The real cause is AGENT_ASSET.md §4's subject-armature trap, recurring in a
# form the 2026-08-17 fix does not catch. The bake's own note:
#
#     picked 'Biped' (102 bones, 24 props anchored to it)
#
# against the wagon's `FourWheelRam` (14 bones, 10 props). The subject pick
# ranks by props anchored TO each rig, and the Pyrogenesis importer anchors ALL
# FOUR crew members' heads and helmets to the SAME `Biped` object -- 4 crew x 6
# props = 24 -- so one soldier outvotes the wagon. The clip then lands on him,
# the wagon holds its bind pose, and nothing moves.
#
# That mis-anchoring is also the OTHER defect the old header reported, described
# there as the four crew "stacked in a vertical column". It is not the bodies:
# `prop_engineer_a..d` place correctly at four distinct points beside the cart.
# It is the heads -- three crew bare-headed with four heads and four helmets
# piled on the fourth, all at (3.52, -3.45, 3.69).
#
# WHY NOT FIX THE PICK. Two reasons, and the second is the deciding one:
#   1. It is the rig pick every composite actor shares, and it has been got
#      wrong twice already (§4). Not something to change for one asset.
#   2. Even with the right subject it would not help much here. The crew become
#      riders, and the Han `mangonel_infantry_*` clips are the ones Blender's
#      COLLADA importer refuses outright -- the defect that forces
#      `drive_riders = false` on trebuchet_deployed.toml. So the crew would be
#      kept only to stand frozen while the cart rolls out from under them, and
#      the two zebu would freeze with them.
#
# Baking the wagon instead makes this actor STRUCTURALLY IDENTICAL to the two
# packed engines that already work: in onager_packed and ballista_packed the
# wagon IS the root actor, so `FourWheelRam` is unanchored and wins the pick
# outright. Verified 2026-08-28 -- subject `FourWheelRam`, both clips attach,
# and "driving 2 of 2 nested-prop armature(s)", so the OXEN WALK too.
#
# WHAT IT COSTS: the four `engineer_a..d` crew, which hang off the pivot rather
# than the wagon and so are not imported at all. Project owner's call of
# 2026-08-28, taking a clean animated ox-cart over four frozen (and mostly
# headless) soldiers. This is therefore the one packed engine with no crew;
# the onager's and ballista's crew ride on their wagons and are unaffected.
#
# Frame sizes confirm nothing else changed: side-on 168x107 against the old
# pivot bake's 167x107, at the same 22.627 px/m. Only the end-on views narrow
# (79 -> 52 px), which is exactly the crew's width leaving.
# ---------------------------------------------------------------------------
id      = "vis.trebuchet_packed"
adapter = "zeroad"

[source]
# The wagon, NOT units/han/siege_mangonel_pivot_packed.xml. See above.
# It declares Idle/Walk/Run on itself and carries the struck-down mangonel at
# `cargo` plus a zebu at each of `horse_l` / `horse_r`.
actor = "units/han/siege_mangonel_packed.xml"
# NO `drive_riders = false`. The two zebu ARE the riders here and their clips
# load fine; switching riders off would freeze them for no gain. The unloadable
# `mangonel_infantry_*` clips that force that flag on trebuchet_deployed.toml
# are reached through the PIVOT's props, so they are out of this bake entirely.

[render]
# 512 carried from the siblings. The wagon alone is smaller than the old
# pivot-rooted subject (1.894 m vs 2.411 m tall), so this is generous rather
# than tight: 34.0% page fill and no CLIPPED. Kept at 512 for consistency with
# onager_packed.toml and ballista_packed.toml rather than trimmed.
canvas = [512, 512]
supersample = 2
directions = 5
frame_origin_at = 0.2
engine = "eevee"
samples = 24
# The zeroad adapter renders every subject 180 deg from the direction the atlas
# then labels it; this cancels it. Kept from the deployed half -- it is a
# per-source correction and both halves share a source convention.
yaw_offset_deg = 180.0

# Plain clip names, resolved against the actor in [source] -- which now declares
# them itself, so the `file =` workaround this recipe used to need is gone.
[anims.idle]
clip = "Idle"
frames = 12
fps = 8
loop = true

# A packed siege engine is the one siege state that MOVES, so like the other two
# packed engines this has a real walk clip and need not be wired at `speed: 0`.
# 0 A.D. points Walk and Run at the same `_move.dae`, so a `run` added later
# would be the same animation at a different rate.
[anims.walk]
clip = "Walk"
frames = 12
fps = 15
loop = true

