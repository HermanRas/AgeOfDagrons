# Ground tile from 0 A.D.'s water terrain -- "Water shallow / deep"
# (ASSET_MISSING.md 1.4), flagged cheap alongside A.1's grass/dirt/sand.
# Same recipe shape, just a different `terrain =` line.
id      = "terrain.water_shallow"
adapter = "terrain"

[source]
# water_1's own minimap colour (108,156,221) is the lightest of the three
# water textures -- picked as "shallow" on that basis, water_3 as "deep"
# (terrain_water_deep.toml) for maximum contrast between the two.
terrain = "water/water_1.xml"
texture_metres = 2.0

[render]
canvas = [72, 40]
supersample = 4
directions = 1
frame_origin_at = 0.5
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/terrains/water/water_1.xml"
