# University -- AGE 4 (Age of Dragons), the Roman skin (PLAN.md 2.7, 9.2).
#
# Generated 2026-08-15 in the age-4 building pass. Buildings carry the age;
# units do not.
#
# Actor resolved through its entity template, never guessed from a filename:
#   simulation/templates/structures/mace/temple.xml -> <VisualActor><Actor>
#
# Macedonian, the one age-4 building not Roman.
#
# Render settings inherited from the calibrated `university.toml`. Canvas by
# interpolation: a same-role building at the same footprint frames within the
# same box, and the clip-check reports a canvas that is too small rather than
# cropping silently -- so read the first bake's report rather than trusting this.
id      = "vis.university_age4"
adapter = "zeroad"

[source]
actor = "structures/macedonians/temple.xml"

[render]
# CANVAS RAISED 2026-08-15 from the first bake's clip report: it lost the
# S frame at the inherited size. Subject measures 8.931 m.
# The inherited canvas came from the age-1/placeholder recipe for this same
# building, and later civs build bigger -- that is where interpolation across
# AGES breaks down, though it holds fine across same-age re-skins.
canvas = [672, 576]
supersample = 4
directions = 1
frame_origin_at = 0.42
ground_clip = true
engine = "eevee"
samples = 32
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/macedonians/temple.xml"
