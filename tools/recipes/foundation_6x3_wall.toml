# Building site for the medium wall segment.
id      = "vis.foundation_6x3_wall"
adapter = "zeroad"

[source]
actor = "structures/fndn_6x3_wall.xml"
# simulation/templates/structures/athen/wall_medium.xml declares this as its
# FoundationActor.

[render]
# inspect: 26 x 14 x 4.624 raw units -- same size_x as fndn_6x6.xml
# (canvas [448,288]) but narrower along depth, so reusing that canvas is safe
# margin, not a tight fit.
canvas = [448, 288]
supersample = 4
# 4 directions, not 1 (2026-08-15, project owner). A wall is not a building:
# buildings sit at one fixed orientation, walls RUN -- they enclose a base, so
# every piece has to be placeable along either diagonal and facing either way.
# One sprite cannot do that. 4 evenly-spaced yaws is the whole wall vocabulary.
#
# Costs 4x the frames but NOT a bigger canvas: in a 2:1 isometric projection the
# two diagonals project to mirror-image bounding boxes of identical size, so the
# canvas measured for the current orientation still holds at 90/180/270. Read
# the clip report on the first bake anyway rather than trusting that.
directions = 4
frame_origin_at = 0.45
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
