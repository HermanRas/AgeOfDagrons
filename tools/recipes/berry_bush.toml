# Berry bush, from 0 A.D.'s gaia fruit bush.
#
# simulation/templates/gaia/fruit/berry_01.xml (berry_02/03/04 are terrain-
# biome variants of the same template) declares this actor directly as its
# VisualActor -- there is no separate building-style wrapper the way farms and
# structures have one.
#
# No depleted state exists in the source: template_gaia_fruit.xml uses
# KillBeforeGather=false with Regrowth (the bush stays visually intact through
# gathering and regrows over time), and the actor has no "picked" variant --
# only random mesh/texture variety (2 mesh x 2 texture, both frequency=1, a
# plain random-variety group unlike the field's frequency=0 named stages).
# `vis.berry_bush` therefore covers "full" only; "depleted" in
# ASSET_MISSING.md 1.3/2.3 has nothing to map to and stays TODO.
id      = "vis.berry_bush"
adapter = "zeroad"

[source]
actor = "props/flora/berry_bush.xml"

[render]
# inspect measures 10.447 x 10.000 x 6.792 raw units -> 5.22 x 5.0 x 3.40 m.
# Radially symmetric like the oak (tree_oak.toml), so same directions=5
# mirroring and a low frame_origin_at (little below-anchor content, all
# canopy above it). Canvas generous pending a real probe; isobake bake's
# canvas-edge check will flag it if this guess is too tight.
canvas = [256, 256]
supersample = 4
directions = 5
frame_origin_at = 0.15
engine = "eevee"
samples = 32
# The zeroad adapter renders every subject 180 deg from the direction the
# atlas then labels it; this cancels it. Added 2026-08-25 -- asset_request.md P2.
yaw_offset_deg = 180.0

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/props/flora/berry_bush.xml"
