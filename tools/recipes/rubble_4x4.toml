# Generic stone rubble for a 4x4 building -- the blacksmith's destroyed
# state. See rubble_3x3.toml for why these are keyed by size and shared.
id      = "vis.rubble_4x4"
adapter = "zeroad"

[source]
actor = "structures/destruct_stone_4x4.xml"

[render]
# inspect: 30 x 30 x 13.029 m. Canvas interpolated from the
# destruct_stone_3x3/destruct_hele_cc calibration pair, plus extra height
# margin for this mound's taller-than-baseline profile.
canvas = [496, 464]
supersample = 4
ground_clip = true
directions = 1
frame_origin_at = 0.55
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/structures/destruct_stone_4x4.xml"
