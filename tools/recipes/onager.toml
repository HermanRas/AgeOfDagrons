# Onager, Siege Workshop from age 3 (PLAN.md 9.2, Age & Unit Planning.md).
# Requested by the game agent in asset_request.md 2026-08-16.
#
# Deployed pose, same reasoning as ballista.toml. Resolved:
#
#   units/rome/siege_onager_unpacked
#     -> simulation/templates/units/rome/siege_onager_unpacked.xml
#     -> <VisualActor><Actor>units/romans/siege_onager_pivot.xml</Actor>
#
# Note `_pivot` rather than a plain `_unpacked` actor -- worth stating because
# the obvious guess from the template name would have been wrong, which is the
# whole reason the roster's lines get resolved instead of pattern-matched.
#
# STATIC for the same reason as the ballista: `isobake inspect` reports
# `Biped (0 bones)`, so any declared clip would abort the bake rather than
# degrade. See ballista.toml for the full working and the game agent's reply.
id      = "vis.onager"
adapter = "zeroad"

[source]
actor = "units/romans/siege_onager_pivot.xml"

[render]
# `isobake inspect` measures 10.361 x 14.666 x 5.640 m raw, 110 px tall at
# 22.627 px/m. The WIDEST of the three siege engines by footprint and the
# shortest by height, so the constraint here is horizontal, not vertical.
#
# RAISED 384 -> 512 on 2026-08-16. 384 covered the engine, but it was sized
# against a bake whose three crew had no heads: isobake 9ac13a0 anchors the
# heads and helmets that used to sit at the world origin, the crew stand at the
# outside of the frame, and S/SE/E all touched the render edge and lost content.
# The canvas only costs render time -- the packed page is trimmed to the
# content either way -- so this is over-provisioned deliberately rather than
# trimmed to the measured overflow.
canvas = [512, 512]
supersample = 2
# 5 mirrored to 8, same as siege_ram and ballista -- symmetric engine, no
# one-sided prop to swap under mirroring.
directions = 5
frame_origin_at = 0.2
engine = "eevee"
samples = 24

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/units/romans/siege_onager_pivot.xml"
