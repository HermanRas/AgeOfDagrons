# Stone, SMALL size class -- 1000 (Age & Unit Planning.md §ORE).
#
# RE-POINTED 2026-08-17 from `geology/stonemine_medit_quarry.xml`, which was an
# off-roster pick made when legibility mattered more than matching the roster.
# The roster asks for the temperate granite boulders:
#
#   simulation/templates/gaia/rock/temperate_small.xml
#     -> <VisualActor><Actor>geology/stonemine_granite.xml</Actor>
#
# Note the id keeps its name. `vis.stone_mine` is referenced from the game side
# already, so the base id stays put and only the LARGE class takes a suffix --
# same convention as the gold set.
#
# Worth flagging to whoever wires this: there is still no `res.stone` resource
# node in `resources.json`, so nothing on any map yields stone even though
# buildings cost it. The art has been staged and unreferenced this whole time.
# That is game-side work (PLAN.md 6.5), not a bake.
id      = "vis.stone_mine"
adapter = "zeroad"

[source]
actor = "geology/stonemine_granite.xml"

[render]
# 6.609 x 6.430 x 4.028 m raw, 79 px tall -- the smallest node in the set. The
# previous quarry needed 384; granite boulders need a fraction of that.
canvas = [256, 256]
supersample = 4
directions = 5
frame_origin_at = 0.45
ground_clip = true
engine = "eevee"
samples = 32

[attribution]
source = "0 A.D. (Wildfire Games)"
licence = "CC-BY-SA 3.0"
licence_url = "http://creativecommons.org/licenses/by-sa/3.0/"
author = "Wildfire Games"
author_url = "http://www.wildfiregames.com/"
actor = "art/actors/geology/stonemine_granite.xml"
