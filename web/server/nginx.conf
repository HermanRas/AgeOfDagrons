# nginx for aod.dragoon.co.za (phase 0.3). Serves the website AND the pack downloads.
#
# WHY NGINX AND NOT THE PHP BUILT-IN SERVER
#
# The container ran `php -S 0.0.0.0:80 -t /app` until 2026-09-03. PHP's own manual calls
# that server unsuitable for production, and the specific reason it cannot host packs is
# that it is SINGLE-THREADED: one phone pulling a 400 MB art pack occupies the only worker,
# so the website and every other client's `packs.json` request block until it finishes. Its
# Range support is also partial, and Range is what a resumed download is made of.
#
# Nothing here needs PHP. Every page is static HTML.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client sends no Accept-Encoding it needs honoured, and the payloads are already
    # compressed archives. Leaving gzip on would spend CPU re-compressing a zip AND make
    # Content-Length describe the compressed body -- which is the bug `PackInstaller`
    # disables `accept_gzip` to avoid from the other end.
    gzip off;

    # ⚠️ THERE IS NO `types { }` BLOCK HERE, AND THERE MUST NOT BE.
    #
    # This file had one -- `types { application/octet-stream pck; }` -- to give `.pck` a MIME
    # type, and **it took the website down for four hours on 2026-09-03**: opening
    # aod.dragoon.co.za downloaded a file instead of showing the page.
    #
    # A `types` block inside `server` **REPLACES the entire inherited MIME map**, it does not
    # add one entry to it. So `.html` lost `text/html`, fell through to the http-level
    # `default_type` -- which in the official nginx image is `application/octet-stream`, not
    # `text/plain` -- and every browser dutifully offered to save the homepage.
    #
    # The lesson generalises: nothing in a server block should override an inherited MAP. To
    # give one extension a type, set `default_type` in a `location` that matches only that
    # extension (see the pck/zip block at the bottom), which leaves `mime.types` intact.
    #
    # It also survived my own testing because `Invoke-WebRequest` and `curl -o` do not care
    # what the Content-Type says. Checking a page means checking its HEADERS, not its bytes.

    location / {
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        # NO DIRECTORY LISTING. The manifest is the index; an autoindex would also expose
        # half-uploaded files, which is exactly the window `web/README.md` tells you to
        # avoid by publishing packs.json last.
        autoindex off;

        # ⚠️ NO `add_header Accept-Ranges` HERE. nginx sends it natively for static files,
        # and adding it explicitly produced the literal header `Accept-Ranges: bytes,bytes`
        # on the first deploy -- two values in one header, which a strict client is entitled
        # to reject and which no amount of reading the config would explain. Range support
        # is a requirement of this location; it is simply already met.
    }

    # THE MANIFEST IS THE ONE FILE THAT MUST NOT BE CACHED HARD. It is how a client learns
    # a new pack exists, so a stale copy at a CDN or in a phone's HTTP cache means the
    # publish did not happen as far as that device is concerned. Small file, cheap to
    # revalidate.
    location = /downloads/packs.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/json;
    }

    # Packs carry their version IN THE FILENAME (`campaign_howtoplay_v1.zip`, PLAN.md 3.2),
    # so a given URL's bytes never change and can be cached forever. A new version is a new
    # URL, which is the whole reason the naming is that way.
    location ~* \.(pck|zip)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # `.pck` is not in nginx's `mime.types`, so it needs a type from somewhere. This is
        # the safe way to give it one: `default_type` applies ONLY where the map has no
        # entry, so it names `.pck` and leaves `.zip` on the `application/zip` the map
        # already provides -- and, unlike a `types` block, it cannot reach any other
        # extension. See the note above `location /`.
        default_type application/octet-stream;
    }
}
